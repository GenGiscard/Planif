<!DOCTYPE html>
<html lang="fr" data-theme="clair">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Kik Planif'</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Cpath d=%27M12.5 8V3M27.5 8V3%27 stroke=%27%232f6f9f%27 stroke-width=%273.4%27 stroke-linecap=%27round%27/%3E%3Crect x=%273%27 y=%276%27 width=%2734%27 height=%2731%27 rx=%277%27 fill=%27%23e8763f%27/%3E%3Cpath d=%27M13 20v12M13 26l6.5-6M13 26l7 6%27 stroke=%27white%27 stroke-width=%273.2%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3Crect x=%2724%27 y=%2720.4%27 width=%279%27 height=%272.8%27 rx=%271.4%27 fill=%27white%27/%3E%3Crect x=%2724%27 y=%2725.4%27 width=%276%27 height=%272.8%27 rx=%271.4%27 fill=%27white%27 fill-opacity=%27.6%27/%3E%3C/svg%3E">
<style>
:root{
  --ink:#233043; --ink-2:#5a6b7d; --ink-3:#8496a6;
  --paper:#f2f4f7; --card:#ffffff; --card-2:#f8fafb;
  --line:#dde3e9; --line-2:#c3ced8;
  --accent:#e8763f; --accent-2:#f0f6ff;
  --bleu:#2f6f9f; --vert:#2f8f5b; --rouge:#c0392b; --violet:#7a5ba6;
  --side:#ffffff; --side-txt:#3c4b5c; --side-hi:#f3f6f9;
  --r:6px; --safe-b:env(safe-area-inset-bottom,0px);
  --colw:106px; --namew:236px; --countw:150px;
  --sidew:238px;
}
html[data-theme=sombre]{
  --ink:#e6ecf2; --ink-2:#a8b6c4; --ink-3:#7d8d9c;
  --paper:#141c25; --card:#1b2530; --card-2:#212d3a;
  --line:#2e3d4d; --line-2:#3d5062;
  --accent:#f08a55; --accent-2:#22303f;
  --side:#1b2530; --side-txt:#c2ced9; --side-hi:#25323f;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font:13.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--bleu)}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg.ic{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
svg.ic.sm{width:16px;height:16px}
svg.ic.lg{width:24px;height:24px}

/* ============ ossature ============ */
.shell{display:flex;height:100%}
.main{flex:1;display:flex;flex-direction:column;min-width:0}

/* ============ barre latérale ============ */
#sidebar{width:var(--sidew);flex:none;background:var(--side);border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:60}
.sidehead{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
.logo{display:flex;align-items:center;gap:9px;min-width:0}
.logo .glyph{width:34px;height:34px;flex:none}
.logo b{font-size:17px;letter-spacing:.14em;font-weight:700;color:var(--ink);white-space:nowrap;line-height:1}
.logo b span{font-weight:300;color:var(--accent);margin-left:.28em;letter-spacing:.13em}
.pin{margin-left:auto;color:var(--ink-3);padding:4px}
.pin.on{color:var(--accent)}
.sidesearch{position:relative;padding:0 14px 10px}
.sidesearch svg{position:absolute;left:24px;top:50%;transform:translateY(-60%);color:var(--ink-3)}
.sidesearch input{width:100%;border:none;border-bottom:1px solid var(--line);background:transparent;
  padding:7px 4px 7px 28px;font-size:13.5px}
.sidesearch input::placeholder{color:var(--ink-3)}
.sidescroll{flex:1;overflow-y:auto;padding-bottom:24px}
.grp{margin-top:14px}
.grp-t{display:flex;align-items:center;gap:10px;padding:0 16px 6px;color:var(--accent);font-size:14px}
.grp-t span{white-space:nowrap}
.grp-t i{flex:1;height:1px;background:var(--line);display:block}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:9px 16px;color:var(--side-txt);
  text-align:left;font-size:13.5px;position:relative}
.mi:hover{background:var(--side-hi)}
.mi.on{background:var(--side-hi);color:var(--ink);font-weight:600}
.mi.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.mi .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .star{opacity:0;color:var(--ink-3);padding:2px}
.mi:hover .star{opacity:1}
.mi .star.on{opacity:1;color:var(--accent)}
.scrim{display:none;position:fixed;inset:0;background:rgba(15,25,35,.45);z-index:55}

/* ============ en-tête ============ */
.topbar{height:58px;flex:none;display:flex;align-items:center;gap:16px;padding:0 18px;
  background:var(--card);border-bottom:1px solid var(--line)}
.etab{line-height:1.2;min-width:0}
.etab b{display:block;font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etab span{display:block;font-size:11.5px;color:var(--ink-2);letter-spacing:.06em}
.spacer{flex:1}
.tico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);position:relative}
.tico:hover{background:var(--card-2);color:var(--ink)}
.tico.ring{border:2px solid var(--accent);color:var(--accent)}
.tico .badge{position:absolute;top:1px;right:1px;min-width:15px;height:15px;border-radius:8px;
  background:var(--accent);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.who{display:flex;align-items:center;gap:9px}
.who b{font-size:14.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.who .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;
  font-size:12px;font-weight:700;background:var(--bleu)}
.burger{display:none;color:var(--ink-2);padding:6px}

/* ============ barre de vue ============ */
#viewbar{flex:none;background:var(--card);border-bottom:1px solid var(--line);padding:9px 18px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:50px}
#viewbar:empty{display:none}
.vtitle{font-size:15px;font-weight:650;margin-right:4px}
.wk{display:flex;align-items:center;gap:6px}
.wk .num{font-size:18px;font-weight:700;color:var(--accent);min-width:48px;text-align:center}
.nav{width:30px;height:30px;border:1px solid var(--line);border-radius:var(--r);display:grid;place-items:center;
  color:var(--ink-2);background:var(--card)}
.nav:hover{background:var(--card-2)}
.range{color:var(--ink-2);font-size:12.5px}
label.fl{color:var(--ink-2);font-size:12.5px}
select,input[type=text],input[type=time],input[type=date],input[type=number],input[type=url],input[type=email],input[type=tel]{
  border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:6px 8px;color:var(--ink)}
textarea{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:7px;
  color:var(--ink);font:inherit;width:100%}
.btn{border:1px solid var(--line-2);background:var(--card);padding:7px 13px;border-radius:var(--r);color:var(--ink)}
.btn:hover{background:var(--card-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{border-color:#e3b6b0;color:var(--rouge)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.chipbtn{border:1px solid var(--line);border-radius:14px;padding:5px 12px;font-size:12.5px;background:var(--card)}
.chipbtn.on{background:var(--ink);border-color:var(--ink);color:var(--card);font-weight:600}
.sync{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);white-space:nowrap;
  padding:5px 9px;border-radius:14px}
.sync:hover{background:var(--card-2)}
.dot{width:8px;height:8px;border-radius:50%;background:#95a3b0;flex:none}
.dot.on{background:#3fae72} .dot.off{background:#e0a13c}

/* ============ page ============ */
#page{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
.pad{padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px}
.h2{font-size:15px;font-weight:650;margin:0 0 10px}
.muted{color:var(--ink-2)}
.empty{padding:38px 20px;color:var(--ink-2);max-width:46ch}
.empty h2{margin:0 0 6px;font-size:15px;color:var(--ink)}
.empty p{margin:0 0 14px}

/* accueil */
.today{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;text-align:center;margin-bottom:16px}
.today b{display:block;font-size:17px;font-weight:600}
.today span{color:var(--ink-2)}
.rappels{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:16px}
.rap{display:flex;align-items:center;gap:14px;padding:14px 16px}
.rap .ico{position:relative;color:var(--ink-2)}
.rap .ico b{position:absolute;top:-5px;right:-7px;min-width:17px;height:17px;border-radius:9px;font-size:10px;
  display:grid;place-items:center;color:#fff;background:#3fae72;font-weight:700;padding:0 4px}
.rap .ico b.hot{background:var(--accent)}
.rap .tx{flex:1;min-width:0;line-height:1.3}
.rap .tx b{display:block;font-size:14px;font-weight:650}
.rap .tx span{font-size:12px;color:var(--ink-2)}
.rap .go{color:var(--ink-3);padding:6px}
.meteo{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;overflow-x:auto;margin-bottom:16px}
.met{border-right:1px solid var(--line);padding:10px 8px;text-align:center;min-width:104px}
.met:last-child{border-right:none}
.met b{display:block;font-size:13px;font-weight:650;margin-bottom:6px;white-space:nowrap}
.met .tmp{display:flex;justify-content:center;gap:10px;font-weight:700;font-size:13px;margin-top:6px}
.met .tmp .mn{color:var(--bleu)} .met .tmp .mx{color:var(--rouge)}
.met svg{color:var(--ink-2)}

/* calendrier mois */
.cal{width:100%;border-collapse:collapse;table-layout:fixed}
.cal th{padding:8px 4px;font-size:12.5px;color:var(--ink-2);font-weight:500;border-bottom:1px solid var(--line)}
.cal td{border:1px solid var(--line);vertical-align:top;padding:4px;height:86px;background:var(--card)}
.cal td.off{background:var(--card-2)}
.cal .dnum{font-size:12.5px;color:var(--ink-2);text-align:right;padding:0 2px 3px}
.cal td.tdy .dnum{background:var(--accent);color:#fff;border-radius:11px;width:22px;height:22px;
  display:grid;place-items:center;margin-left:auto;padding:0}
.cbar{border-radius:3px;padding:2px 5px;font-size:11px;margin-bottom:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;color:#16212e}

/* tableaux génériques */
table.tb{width:100%;border-collapse:collapse;background:var(--card)}
table.tb th{text-align:left;font-size:12px;color:var(--ink-2);font-weight:600;padding:9px 10px;
  border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--card);z-index:2}
table.tb td{padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
table.tb tr:hover td{background:var(--card-2)}
table.tb input,table.tb select{width:100%;padding:5px 6px;font-size:12.5px}
table.tb td.num{text-align:right;font-variant-numeric:tabular-nums}

/* ============ grille planning ============ */
.planwrap{display:flex;height:100%;min-height:0}
.gridwrap{flex:1;overflow:auto;background:var(--card)}
body.paint td.cell,body.paint .mcell{touch-action:none}
table.pl{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
table.pl th,table.pl td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0}
th.day{background:var(--card);position:sticky;top:0;z-index:5;text-align:center;font-weight:600;
  font-size:12.5px;color:var(--ink-2);padding:7px 4px 3px;border-bottom:none}
th.day.today{color:var(--accent)}
th.part{background:var(--card);position:sticky;top:29px;z-index:5;font-weight:500;font-size:11.5px;
  color:var(--ink-3);padding:3px 4px 6px;width:var(--colw);min-width:var(--colw);border-bottom:1px solid var(--line-2)}
th.part.we,th.day.we{background:var(--card-2)}
th.corner{position:sticky;left:0;top:0;z-index:7;background:var(--card);width:var(--namew);min-width:var(--namew);
  border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);text-align:left;
  padding:8px 12px;font-weight:600;color:var(--ink-2);font-size:12px}
th.cornerc{position:sticky;right:0;top:0;z-index:7;background:var(--card);width:var(--countw);min-width:var(--countw);
  border-bottom:1px solid var(--line-2);border-left:1px solid var(--line-2);font-size:12px;
  color:var(--ink-2);font-weight:600;padding:8px 10px;text-align:left}
tr.grouprow td{background:var(--card-2);border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.grouphead{position:sticky;left:0;z-index:4;background:var(--card-2);display:flex;align-items:center;gap:8px;
  padding:6px 12px;font-weight:700;letter-spacing:.05em;font-size:12px}
.grouphead .count{font-weight:400;color:var(--ink-2);letter-spacing:0}
td.name{position:sticky;left:0;z-index:3;background:var(--card);width:var(--namew);min-width:var(--namew);
  border-right:1px solid var(--line-2);padding:5px 10px 5px 12px}
tr:hover td.name{background:var(--card-2)}
.person{display:flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:#fff}
.pinfo{min-width:0;line-height:1.28}
.pinfo b{display:block;font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo>span{display:block;font-size:11px;color:var(--ink-2)}
.pinfo em{font-style:normal;color:var(--ink-3)}
.rowedit{margin-left:auto;color:var(--ink-3);padding:2px 4px;visibility:hidden}
tr:hover .rowedit,.mrow .rowedit{visibility:visible}
td.cell{width:var(--colw);min-width:var(--colw);height:46px;padding:2px;background:var(--card);cursor:pointer}
td.cell.we{background:var(--card-2)}
.chip{height:100%;border-radius:3px;padding:3px 5px;display:flex;flex-direction:column;justify-content:center;
  gap:1px;overflow:hidden;border:1px solid rgba(0,0,0,.10);color:#16212e}
.chip .h{font-size:11.5px;font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip .p{font-size:10px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.82}
.chip.abs{align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.04em}
.cell-empty{height:100%;min-height:40px;border-radius:3px;border:1px dashed transparent}
td.cell:hover .cell-empty{border-color:var(--line-2);background:var(--card-2)}
tr.grouptot td{background:var(--card-2);border-bottom:1px solid var(--line-2);font-size:11.5px;color:var(--ink-2)}
tr.grouptot td.name{background:var(--card-2);padding:5px 12px;font-weight:600}
td.tot{text-align:center;padding:4px 2px;font-variant-numeric:tabular-nums}
td.tot b{display:block;font-size:12px;color:var(--ink)}
td.count{position:sticky;right:0;z-index:3;background:var(--card);width:var(--countw);min-width:var(--countw);
  border-left:1px solid var(--line-2);padding:4px 10px}
tr:hover td.count{background:var(--card-2)}
tr.grouptot td.count{background:var(--card-2)}
.cnt{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--ink-2);line-height:1.5}
.cnt b{font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums}
.cnt b.over{color:var(--rouge)} .cnt b.under{color:var(--bleu)}

/* vue journée */
.mday{display:none}
.mgtitle{position:sticky;top:0;z-index:2;background:var(--card-2);padding:7px 12px;font-weight:700;
  font-size:12px;letter-spacing:.05em;border-bottom:1px solid var(--line-2);display:flex;gap:8px}
.mgtitle .count{font-weight:400;color:var(--ink-2);letter-spacing:0;margin-left:auto}
.mhead{padding:5px 10px;background:var(--card);border-bottom:1px solid var(--line-2);font-size:11px;
  color:var(--ink-3);font-weight:600;display:grid;gap:6px}
.mhead span:not(:first-child){text-align:center}
.mrow{display:grid;gap:6px;align-items:stretch;padding:7px 10px;border-bottom:1px solid var(--line);background:var(--card)}
.mperson{display:flex;align-items:center;gap:8px;min-width:0}
.mcell{min-height:48px;padding:2px;border-radius:3px;cursor:pointer;background:var(--card-2)}
.mcell .cell-empty{border-color:var(--line);background:var(--card)}
.mini-cnt{display:block;font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mini-cnt b.over{color:var(--rouge)} .mini-cnt b.under{color:var(--bleu)}
.mobonly{display:none}
.jourbar{display:flex;gap:5px;overflow-x:auto;padding:2px 0;flex:1}
body.dense .chip{padding:2px 4px}
body.dense .chip .h{font-size:10.5px}
body.dense .chip .p{font-size:9.5px}
body.dense td.cell{height:42px}
body.dense .pinfo b{font-size:12px}
body.dense .pinfo>span{font-size:10.5px}
body.dense .avatar{width:26px;height:26px;font-size:10px}
body.dense .cnt{font-size:11px;gap:4px}
body.dense th.part{font-size:11px}
body.dense th.day{font-size:12px}
body.dense td.name{padding:4px 8px 4px 10px}
.fabfav.on{display:block}
body.railover .rail{position:fixed;top:0;right:0;bottom:0;width:230px;z-index:70;
  transform:translateX(101%);transition:transform .2s;border-left:1px solid var(--line-2);
  box-shadow:-8px 0 26px rgba(12,22,32,.22)}
body.railover .rail.open{transform:none}
body.railover .rail h3 .close{display:block}
.daybtn{flex:0 0 auto;min-width:52px;border:1px solid var(--line);border-radius:var(--r);padding:5px 7px;
  text-align:center;line-height:1.2;background:var(--card)}
.daybtn b{display:block;font-size:12px;font-weight:650}
.daybtn span{display:block;font-size:10px;color:var(--ink-3)}
.daybtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.daybtn.on span{color:#ffe6d8}

/* timeline */
.tl{min-width:820px}
.tlhead{display:grid;position:sticky;top:0;background:var(--card);z-index:3;border-bottom:1px solid var(--line-2)}
.tlhead span{font-size:11px;color:var(--ink-3);padding:6px 0 6px 4px;border-left:1px solid var(--line)}
.tlrow{display:grid;border-bottom:1px solid var(--line);align-items:center}
.tlname{padding:6px 10px;border-right:1px solid var(--line-2);position:sticky;left:0;background:var(--card);z-index:2}
.tltrack{position:relative;height:44px}
.tlgrid{position:absolute;inset:0;display:grid}
.tlgrid i{border-left:1px solid var(--line)}
.tlbar{position:absolute;top:6px;bottom:6px;border-radius:3px;border:1px solid rgba(0,0,0,.12);
  display:flex;align-items:center;padding:0 6px;font-size:11px;font-weight:650;color:#16212e;
  overflow:hidden;white-space:nowrap;font-variant-numeric:tabular-nums}

/* rail favoris */
  .rail{width:158px;flex:none;border-left:1px solid var(--line);background:var(--paper);
  display:flex;flex-direction:column;overflow:hidden}
.rail h3{margin:0;padding:10px 12px;font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--ink-2);
  border-bottom:1px solid var(--line);background:var(--card);display:flex;align-items:center}
.rail h3 .pinr{margin-left:auto;color:var(--ink-3);padding:2px 4px}
.rail h3 .pinr.on{color:var(--accent)}
.rail h3 .close{display:none;margin-left:6px;color:var(--ink-2)}
.railscroll{overflow:auto;padding:8px;flex:1}
.armed{margin:0 0 8px;padding:8px 10px;background:var(--accent);color:#fff;border-radius:var(--r);
  font-size:11.5px;line-height:1.35;display:none}
.armed.on{display:block}
.armed button{background:rgba(255,255,255,.22);color:#fff;border-radius:3px;padding:4px 8px;margin-top:6px;font-size:11px}
.favgrid{display:flex;flex-direction:column;gap:5px}
.fav{border:1px solid rgba(0,0,0,.12);border-radius:var(--r);padding:6px 8px;text-align:left;width:100%;
  line-height:1.25;position:relative;color:#16212e}
.fav b{display:block;font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums}
.fav>span{display:block;font-size:10px;opacity:.75}
.fav.sel{outline:2px solid var(--ink);outline-offset:1px}
.fav .del{position:absolute;right:2px;top:2px;background:rgba(255,255,255,.7);border-radius:3px;
  font-size:10px;line-height:1;padding:3px 5px;color:#333}
.absrow{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:10px}
.railfoot{border-top:1px solid var(--line);padding:8px 8px calc(8px + var(--safe-b));background:var(--card)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:6px}
.railfoot input{width:100%;padding:6px;font-size:12px}
.linkbtn{color:var(--bleu);font-size:11.5px;text-decoration:underline;padding:0}
.fabfav{display:none;position:fixed;right:14px;bottom:calc(14px + var(--safe-b));z-index:40;background:var(--accent);
  color:#fff;border-radius:22px;padding:12px 18px;font-weight:650;box-shadow:0 6px 18px rgba(12,22,32,.3)}

/* dialogues */
dialog{border:none;border-radius:8px;padding:0;width:min(520px,94vw);color:var(--ink);background:var(--card);
  box-shadow:0 18px 48px rgba(12,22,32,.3)}
dialog::backdrop{background:rgba(16,26,36,.45)}
.dlg-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.dlg-h h2{margin:0;font-size:15px;font-weight:650}
.dlg-h span{font-size:12px;color:var(--ink-2)}
.dlg-b{padding:16px 18px;display:flex;flex-direction:column;gap:13px;max-height:64vh;overflow:auto}
.dlg-f{padding:12px 18px calc(12px + var(--safe-b));border-top:1px solid var(--line);display:flex;gap:8px;
  align-items:center;background:var(--card-2);flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px}
.field>label{font-size:11.5px;color:var(--ink-2);font-weight:600}
.field input,.field select,.field textarea{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.typebar{display:flex;flex-wrap:wrap;gap:5px}
.warnbox{background:#fdf6ec;border:1px solid #eddcbf;border-radius:var(--r);padding:9px 11px;
  font-size:11.5px;line-height:1.45;color:#6b4f1d;margin:0}
html[data-theme=sombre] .warnbox{background:#332a1c;border-color:#4d4028;color:#e3cfa8}
.toast{position:fixed;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);background:#233043;
  color:#fff;padding:10px 16px;border-radius:5px;font-size:12.5px;opacity:0;pointer-events:none;
  transition:opacity .18s;z-index:99;max-width:88vw;text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ============ mobile ============ */
@media (max-width:1000px){
  #sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-101%);transition:transform .22s;
    box-shadow:0 0 32px rgba(10,18,26,.28)}
  #sidebar.open{transform:none}
  .scrim.on{display:block}
  .burger{display:block}
  .topbar{gap:10px;padding:0 10px}
  .topbar .hide-m{display:none}
  .sync{padding:6px;border-radius:50%}
  #syncTxt{display:none}
  .sync .dot{width:11px;height:11px}
  #viewbar{padding:8px 10px;gap:8px}
  .range{display:none}
  .pad{padding:12px}
  table.pl{display:none}
  .mday{display:block}
  .mobonly{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%}
  body.vsem table.pl{display:table}
  body.vsem .mday{display:none}
  body.vsem{--colw:84px;--namew:138px;--countw:104px}
  body.vsem .pinfo b{font-size:11.5px}
  body.vsem .pinfo>span{font-size:10px}
  body.vsem .avatar{width:24px;height:24px;font-size:9.5px}
  body.vsem td.cell{height:42px}
  .rail{position:fixed;inset:auto 0 0 0;width:100%;height:min(72vh,560px);z-index:70;border-left:none;
    border-top:1px solid var(--line-2);border-radius:12px 12px 0 0;transform:translateY(101%);
    transition:transform .22s;box-shadow:0 -8px 28px rgba(12,22,32,.28)}
  .rail.open{transform:none}
  .rail h3 .close{display:block}
  .favgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .fabfav{display:block}
  dialog{width:100%;max-width:none;margin:auto 0 0;border-radius:12px 12px 0 0}
  .dlg-b{max-height:56vh}
  .row3{grid-template-columns:1fr 1fr}
  .row3 .field:last-child{grid-column:span 2}
  .cal td{height:auto;min-height:60px}
  .cbar{font-size:9.5px}
  .tbwrap{overflow-x:auto}
}
body.nopin #sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-101%);
  transition:transform .22s;box-shadow:0 0 32px rgba(10,18,26,.28)}
body.nopin #sidebar.open{transform:none}
body.nopin .burger{display:block}
@media print{
  #sidebar,.topbar,#viewbar,.rail,.fabfav,.toast,.scrim{display:none!important}
  html,body,#page{overflow:visible;height:auto;background:#fff}
  .shell{display:block}
  .mday{display:none!important}
  table.pl{display:table!important;width:100%;font-size:10px}
  td.name,td.count,th.corner,th.cornerc,th.day,th.part,.grouphead{position:static}
  td.cell{height:34px}
}
</style>
</head>

const fmt=m=>{if(m==null||isNaN(m))return"—";const s=m<0?"-":"";m=Math.abs(Math.round(m));return s+pad(Math.floor(m/60))+"h"+pad(m%60)};
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());

function isoSem(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const j=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-j);
  const a=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return {an:t.getUTCFullYear(), num:Math.ceil(((t-a)/86400000+1)/7)};
}
const semId=d=>{const s=isoSem(d);return s.an+"-W"+pad(s.num)};
function duree(s){
  if(!s||s.type!=="travail")return 0;
  let d=toMin(s.fin)-toMin(s.debut); if(d<=0)d+=1440;
  return Math.max(0,d-(s.pause||0));
}

function joursEntre(a,b){return Math.round((dateDe(b)-dateDe(a))/86400000)}
function dansXjours(iso,x){ if(!iso) return false; const n=joursEntre(ymd(new Date()),iso); return n>=0&&n<=x; }
function anniversaireDans(iso,x){
  if(!iso) return false;
  const n=new Date(), d=dateDe(iso);
  let p=new Date(n.getFullYear(),d.getMonth(),d.getDate());
  if(p<new Date(n.getFullYear(),n.getMonth(),n.getDate())) p=new Date(n.getFullYear()+1,d.getMonth(),d.getDate());
  const j=Math.round((p-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/86400000);
  return j>=0&&j<=x;
}

let FB=null, unsubSem=null, unsubReel=null;
let enLigne=false, cacheIncomplet=false, diagFait=false;
const REGIONS=["firebaseio.com","europe-west1.firebasedatabase.app","us-central1.firebasedatabase.app",
               "asia-southeast1.firebasedatabase.app"];
function candidats(){
  const m=String(dbUrl).match(/^https:\/\/([^.]+)\./);
  const noms=m?[m[1]]:[];
  const urls=[dbUrl,...noms.flatMap(n=>REGIONS.map(r=>"https://"+n+"."+r))];
  return [...new Set(urls.filter(Boolean))];
}
async function sonder(url){
  try{
    const c=new AbortController(); const t=setTimeout(()=>c.abort(),6000);
    const r=await fetch(url+"/"+dbNode+".json?shallow=true",{signal:c.signal});
    clearTimeout(t);
    if(r.ok) return {url,ok:true,txt:"accessible"};
    if(r.status===401||r.status===403) return {url,ok:false,txt:"adresse correcte, règles à publier"};
    return {url,ok:false,txt:"erreur "+r.status};
  }catch(e){ return {url,ok:false,txt:"injoignable"}; }
}
const sonderTout = () => Promise.all(candidats().map(sonder));
async function diagnosticAuto(){
  if(diagFait) return; diagFait=true;
  const r=await sonderTout();
  const bon=r.find(x=>x.ok&&x.url!==dbUrl);
  const regles=r.find(x=>x.url===dbUrl&&x.txt.includes("règles"));
  if(bon) toast("Une autre adresse répond : ouvrez l'indicateur de synchronisation");
  else if(regles) toast("Adresse correcte mais règles Firebase non publiées pour « "+dbNode+" »");
}
const majSync=(cls,txt)=>{$("#syncDot").className="dot "+cls;$("#syncTxt").textContent=txt};
let derniereErreur=null;
function erreurEcriture(e){
  const m=(e&&e.message)?String(e.message):"";
  const perm=/permission|denied/i.test(m);
  derniereErreur={ts:Date.now(), msg:m||"refus sans message", chemin:cheminEnCours};
  toast(perm ? "Écriture refusée par les règles Firebase. Ouvrez l'indicateur de synchronisation."
             : "Écriture impossible"+(m?" : "+m.slice(0,90):""));
}
let cheminEnCours="";
function ecrire(chemin,val){
  cheminEnCours=chemin;
  const r=FB.ref(FB.db,chemin);
  return (val===null?FB.remove(r):FB.set(r,val)).catch(erreurEcriture);
}

async function initFirebase(){
  if(!dbUrl){ majSync("","Local"); return; }
  majSync("off","Connexion");
  try{
    const [A,D]=await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js")]);
    FB={db:D.getDatabase(A.initializeApp({databaseURL:dbUrl},"si"+Date.now())), ...D};
    FB.onValue(FB.ref(FB.db,".info/connected"),s=>{
      const ok=!!s.val();
      if(ok&&!enLigne){ ST.cache={}; cacheIncomplet=false; rendre(); }
      enLigne=ok; majSync(ok?"on":"off", ok?"Synchronisé":"Hors ligne");
      if(!ok) setTimeout(()=>{ if(!enLigne) diagnosticAuto(); },8000);
    });
    FB.onValue(FB.ref(FB.db,dbNode+"/config"),s=>{
      const v=s.val();
      if(v) ST.cfg={ resto:{...ST.cfg.resto,...(v.resto||{})}, services:v.services||ST.cfg.services,
                     postes:v.postes||ST.cfg.postes, favoris:v.favoris||{} };
      mirroir(); majEntete(); rendre();
    },()=>{ majSync("off","Accès refusé"); toast("Firebase refuse la lecture du nœud « "+dbNode+" »"); });
    FB.onValue(FB.ref(FB.db,dbNode+"/employes"),s=>{ ST.employes=s.val()||{}; mirroir(); rendre(); });
    FB.onValue(FB.ref(FB.db,dbNode+"/validations"),s=>{ ST.validations=s.val()||{}; rendre(); });
    FB.onValue(FB.ref(FB.db,dbNode+"/traces"),s=>{ ST.traces=s.val()||{}; if(vue==="traces")rendre(); });
    abonnerSemaine();
  }catch(e){ FB=null; majSync("","Local"); toast("Firebase injoignable, données locales uniquement"); }
}
function abonnerSemaine(){
  if(!FB) return;
  [unsubSem,unsubReel].forEach(u=>{ if(u){try{u()}catch(e){}} });
  const sid=semId(lundi);
  unsubSem = FB.onValue(FB.ref(FB.db,dbNode+"/semaines/"+sid),s=>{
    ST.sem=s.val()||{}; ST.cache[sid]=ST.sem; mirroir(); rendre(); });
  unsubReel = FB.onValue(FB.ref(FB.db,dbNode+"/reel/"+sid),s=>{
    ST.reel=s.val()||{}; if(vue==="em-jour"||vue==="em-hebdo")rendre(); });
}
function ecrireCfg(){ mirroir(); if(FB) ecrire(dbNode+"/config",ST.cfg); }
function ecrireEmploye(id,val){

}
function ecrireCreneau(emp,date,part,val){
  if(val){ (ST.sem[emp]||={}); (ST.sem[emp][date]||={}); ST.sem[emp][date][part]=val; }
  else if(ST.sem[emp]&&ST.sem[emp][date]) delete ST.sem[emp][date][part];
  mirroir();
  if(FB) ecrire(dbNode+"/semaines/"+semId(dateDe(date))+"/"+emp+"/"+date+"/"+part, val||null);
}
function ecrireReel(emp,date,part,val){
  if(val){ (ST.reel[emp]||={}); (ST.reel[emp][date]||={}); ST.reel[emp][date][part]=val; }
  else if(ST.reel[emp]&&ST.reel[emp][date]) delete ST.reel[emp][date][part];
  if(FB) ecrire(dbNode+"/reel/"+semId(dateDe(date))+"/"+emp+"/"+date+"/"+part, val||null);

function valider(sid,on){

async function chargerSemaines(ids){
  const manquants=ids.filter(i=>!ST.cache[i]);
  if(!manquants.length) return;
  if(!FB){ manquants.forEach(i=>ST.cache[i]={}); return; }
  await Promise.all(manquants.map(async i=>{
    try{
      const lu = FB.get(FB.ref(FB.db,dbNode+"/semaines/"+i)).then(x=>x.val()||{});
      const v  = await Promise.race([lu, new Promise(r=>setTimeout(()=>r(null),7000))]);
      if(v===null){ cacheIncomplet=true; ST.cache[i]={}; } else ST.cache[i]=v;
    }catch(e){ cacheIncomplet=true; ST.cache[i]={}; }
  }));
}

function codeMeteo(c){
  if(c<=1) return ["soleil","Ensoleillé"];
  if(c<=3) return ["nuage","Nuageux"];
  if(c<=48) return ["brume","Brouillard"];
  if(c<=67||c>=80&&c<=82) return ["pluie","Pluie"];
  if(c<=77||c===85||c===86) return ["neige","Neige"];
  if(c>=95) return ["orage","Orage"];
  return ["nuage","Variable"];
}
async function chargerMeteo(){
  meteoTentee=true;
  const r=ST.cfg.resto||{};
  if(r.lat==null||r.lon==null) return;
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${r.lat}&longitude=${r.lon}`+
      `&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=7`;
    const j=await (await fetch(u)).json();
    meteo=j.daily||null;
  }catch(e){ meteo=null; }
}

/* calendrier mensuel d'un salarié */
async function calendrierMois(id,an,mois){
  if(!id) return `<p class="muted">Aucun salarié enregistré.</p>`;
  const prem=new Date(an,mois,1), der=new Date(an,mois+1,0);
  const dep=lundiDe(prem);
  const nbSem=Math.ceil((joursEntre(ymd(dep),ymd(der))+1)/7);
  const ids=[]; for(let i=0;i<nbSem;i++){const d=new Date(dep);d.setDate(d.getDate()+i*7);ids.push(semId(d));}
  await chargerSemaines(ids);
  const today=ymd(new Date());
  let h=`<table class="cal"><thead><tr>`+JOURS.map(j=>`<th>${j.replace(".","")}</th>`).join("")+`</tr></thead><tbody>`;
  for(let s=0;s<nbSem;s++){
    h+="<tr>";
    for(let j=0;j<7;j++){
      const d=new Date(dep); d.setDate(d.getDate()+s*7+j);
      const dd=ymd(d), hors=d.getMonth()!==mois;
      let bars="";
      for(const p of PARTS){
        const c=creneauDe(id,dd,p.id); if(!c) continue;
        if(c.type==="travail") bars+=`<div class="cbar" style="background:${couleur(c.debut)}">${c.debut}-${c.fin} (${c.pause||0}')${c.poste?" "+esc(c.poste):""}</div>`;
        else bars+=`<div class="cbar" style="background:${TYPES[c.type].bg};color:${TYPES[c.type].fg}">${TYPES[c.type].code}${c.note?" "+esc(c.note):""}</div>`;
      }
      h+=`<td class="${hors?"off":""}${dd===today?" tdy":""}"><div class="dnum">${d.getDate()===1?MOIS[d.getMonth()].slice(0,4)+". ":""}${d.getDate()}</div>${bars}</td>`;
    }
    h+="</tr>";
  }
  return h+"</tbody></table>";
}

function chip(s){
  if(!s) return '<div class="cell-empty"></div>';

    const t=TYPES[s.type]||TYPES.RH;
    return `<div class="chip abs" style="background:${t.bg};color:${t.fg}" title="${esc(t.lab)}${s.note?" — "+esc(s.note):""}">${t.code}</div>`;
  }
  const d=fmt(duree(s));
  const ti=`${s.debut}-${s.fin} · pause ${s.pause||0} min · ${d}${s.poste?" · "+s.poste:""}${s.note?" — "+s.note:""}`;
  if(colSerre) return `<div class="chip" style="background:${couleur(s.debut)}" title="${esc(ti)}">
    <span class="h">${s.debut}</span><span class="h" style="opacity:.72">${s.fin}</span></div>`;
  return `<div class="chip" style="background:${couleur(s.debut)}" title="${esc(ti)}">
    <span class="h">${s.debut}-${s.fin}</span><span class="p">${s.poste?esc(s.poste):d}</span></div>`;
}

function grilleSemaine(emps,js){
  const parts=partsVis(), today=ymd(new Date());
  let h='<table class="pl"><thead><tr><th class="corner" rowspan="2">Salarié</th>';
  for(const d of js){const we=d.getDay()===0||d.getDay()===6;
    h+=`<th class="day${we?" we":""}${ymd(d)===today?" today":""}" colspan="${parts.length}">${JOURS[(d.getDay()||7)-1]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}</th>`;}
  h+='<th class="cornerc" rowspan="2">Compteurs</th></tr><tr>';
  for(const d of js){const we=d.getDay()===0||d.getDay()===6;
    for(const p of parts) h+=`<th class="part${we?" we":""}">${p.lab}</th>`;}
  h+='</tr></thead>';
  const nb=2+js.length*parts.length;
  for(const srv of ST.cfg.services){
    const list=emps.filter(e=>e.service===srv);
    if(!list.length) continue;
    const rep=!!ST.replie[srv];
    h+=`<tbody><tr class="grouprow"><td colspan="${nb}"><div class="grouphead">
      <button data-fold="${esc(srv)}">${rep?"&#9656;":"&#9662;"}</button>${esc(srv)}
      <span class="count">${list.length} salarié${list.length>1?"s":""}</span></div></td></tr>`;
    if(!rep){
      for(const e of list){
        let cells="";
        for(const d of js){const dd=ymd(d),we=d.getDay()===0||d.getDay()===6;
          for(const p of parts) cells+=`<td class="cell${we?" we":""}" data-e="${e.id}" data-d="${dd}" data-p="${p.id}">${chip(lireCreneau(e.id,dd,p.id))}</td>`;}
        const t=totalSemaine(e.id), ec=t-(e.contrat||0), cl=ec>0?"over":(ec<0?"under":"");
        h+=`<tr><td class="name"><div class="person">
          <span class="avatar" style="background:${avCol(e.id)}">${esc(initiales(e))}</span>
          <span class="pinfo"><b>${esc(nomComplet(e))}</b><span>${esc(e.poste||"")} <em>· ${fmt(e.contrat)}</em></span></span>
          <button class="rowedit" data-emp="${e.id}">${ico("fileEdit","ic sm")}</button></div></td>${cells}
          <td class="count"><div class="cnt"><span>Consommé</span><b class="tnum">${fmt(t)}</b></div>
          <div class="cnt"><span>Écart</span><b class="tnum ${cl}">${ec>0?"+":""}${fmt(ec)}</b></div></td></tr>`;
      }
      h+=totauxGroupe(list,js,parts);
    }
    h+='</tbody>';
  }
  return h+'</table>';
}
function totauxGroupe(list,js,parts){
  let eR="",hR="",tE=0,tH=0;
  for(const d of js){const dd=ymd(d);
    for(const p of parts){
      let e=0,hh=0;
      for(const s of list){const c=lireCreneau(s.id,dd,p.id); if(c&&c.type==="travail"){e++;hh+=duree(c)}}
      tE+=e;tH+=hh;
      eR+=`<td class="tot"><b>${e||"—"}</b></td>`;
      hR+=`<td class="tot">${hh?fmt(hh):"—"}</td>`;
    }}
  return `<tr class="grouptot"><td class="name">Effectif présent</td>${eR}
    <td class="count"><div class="cnt"><span>Postes tenus</span><b>${tE}</b></div></td></tr>
    <tr class="grouptot"><td class="name">Heures planifiées</td>${hR}
    <td class="count"><div class="cnt"><span>Total</span><b class="tnum">${fmt(tH)}</b></div></td></tr>`;
}

VUES.timeline = ()=>{
  bar(barSemaine(filtresPlanning())+barJours());
  const emps=empVisibles(), js=jours();
  if(!emps.length) return page(etatVide());
  const H0=6, H1=26, N=H1-H0;
  const dd=ymd(js[jourActif]);
  const cols=`grid-template-columns:200px 1fr`;
  const heures=Array.from({length:N},(_,i)=>((H0+i)%24));
  let h=`<div class="card tl" style="overflow:hidden">
    <div class="tlhead" style="${cols}"><span style="border:none;padding-left:12px">Heure</span>
    <div style="display:grid;grid-template-columns:repeat(${N},1fr)">`+
    heures.map(x=>`<span>${pad(x)}h</span>`).join("")+`</div></div>`;
  for(const srv of ST.cfg.services){
    const list=emps.filter(e=>e.service===srv);
    if(!list.length) continue;
    h+=`<div class="mgtitle">${esc(srv)}</div>`;
    for(const e of list){
      let bars="";
      for(const p of PARTS){
        const c=lireCreneau(e.id,dd,p.id); if(!c) continue;
        if(c.type!=="travail"){ continue; }
        let a=toMin(c.debut)/60, b=toMin(c.fin)/60; if(b<=a)b+=24;
        const g=Math.max(H0,a), f=Math.min(H1,b);
        if(f<=g) continue;
        bars+=`<div class="tlbar" style="left:${(g-H0)/N*100}%;width:${(f-g)/N*100}%;background:${couleur(c.debut)}"
          title="${c.debut}-${c.fin} · ${fmt(duree(c))}">${c.debut}-${c.fin}</div>`;
      }
      const abs=PARTS.map(p=>lireCreneau(e.id,dd,p.id)).find(c=>c&&c.type!=="travail");
      h+=`<div class="tlrow" style="${cols}"><div class="tlname"><div class="person">
        <span class="avatar" style="background:${avCol(e.id)}">${esc(initiales(e))}</span>
        <span class="pinfo"><b>${esc(nomComplet(e))}</b><span>${esc(e.poste||"")}</span></span></div></div>
        <div class="tltrack"><div class="tlgrid" style="grid-template-columns:repeat(${N},1fr)">${"<i></i>".repeat(N)}</div>
        ${bars||(abs?`<div class="tlbar" style="left:2px;width:110px;background:${TYPES[abs.type].bg};color:${TYPES[abs.type].fg}">${TYPES[abs.type].lab}</div>`:"")}</div></div>`;
    }
  }
  page(wrapPad(h+`</div>`));
  const fs=$("#fService"),fp=$("#fPart");
  if(fs) fs.onchange=()=>{FILT.service=fs.value;rendre()};
  if(fp) fp.onchange=()=>{FILT.part=fp.value;rendre()};
};

function ligneEmargement(e,dd,p){
  const prev=lireCreneau(e.id,dd,p.id), r=lireReel(e.id,dd,p.id);
  if(!prev||prev.type!=="travail") return "";
  const rd=r?r.debut:prev.debut, rf=r?r.fin:prev.fin, rp=r?r.pause:(prev.pause||0);
  const dp=duree(prev), dr=duree({type:"travail",debut:rd,fin:rf,pause:rp});
  const ec=dr-dp;
  return `<tr data-row="${e.id}|${dd}|${p.id}">
    <td><div class="person"><span class="avatar" style="background:${avCol(e.id)}">${esc(initiales(e))}</span>
      <span class="pinfo"><b>${esc(nomComplet(e))}</b><span>${esc(e.poste||"")}</span></span></div></td>
    <td class="muted">${p.lab}</td>
    <td class="tnum">${prev.debut} – ${prev.fin} <span class="muted">(${prev.pause||0}')</span></td>
    <td><input type="time" data-f="debut" value="${rd}" style="width:104px"></td>
    <td><input type="time" data-f="fin" value="${rf}" style="width:104px"></td>
    <td><input type="number" data-f="pause" value="${rp}" min="0" max="240" step="5" style="width:70px"></td>
    <td class="num">${fmt(dr)}</td>
    <td class="num" style="color:${ec>0?"var(--rouge)":ec<0?"var(--bleu)":"var(--ink-2)"}">${ec?(ec>0?"+":"")+fmt(ec):"—"}</td>
    <td>${r?'<span style="color:var(--vert)">saisi</span>':'<span class="muted">prévu</span>'}</td></tr>`;
}

}

function exportSemaine(){
  const L=[["Salarié","Poste","Service","Date","Jour","Créneau","Type","Début","Fin","Pause (min)","Heures payées"]];
  for(const e of listeEmployes()) for(const d of jours()) for(const p of PARTS){
    const s=lireCreneau(e.id,ymd(d),p.id); if(!s) continue;
    L.push([nomComplet(e),e.poste,e.service,ymd(d),JOURS[(d.getDay()||7)-1],p.lab,
      (TYPES[s.type]||{}).lab||s.type,s.debut||"",s.fin||"",s.pause??"",s.type==="travail"?fmt(duree(s)):""]);
  }
  csv(L,"planning-"+semId(lundi)+".csv");
}
function exportPaye(){
  const L=[["Matricule","Salarié","Contrat hebdo","Heures planifiées","Heures réalisées","Écart","Absences"]];
  for(const e of listeEmployes()){
    let prev=0, reel=0, abs=[];
    for(const d of jours()) for(const p of PARTS){
      const c=lireCreneau(e.id,ymd(d),p.id); if(!c) continue;
      if(c.type==="travail"){
        prev+=duree(c);
        const r=lireReel(e.id,ymd(d),p.id);
        reel+=r?duree({type:"travail",...r}):duree(c);
      } else if(c.type!=="RH") abs.push(c.type);
    }
    L.push([e.id,nomComplet(e),fmt(e.contrat),fmt(prev),fmt(reel),fmt(reel-prev),[...new Set(abs)].join(" ")]);
  }
  csv(L,"extraction-paye-"+semId(lundi)+".csv");
}

let peint=false; const dejaPeint=new Set();
const caseDe = el => (el&&el.closest) ? el.closest("td.cell,.mcell") : null;
$("#page").addEventListener("pointerdown",ev=>{
  const td=caseDe(ev.target); if(!td) return;
  if(!arme){ ouvrirCreneau(td); return; }
  ev.preventDefault(); peint=true; alertePart=false; dejaPeint.clear(); appliquer(td);
});
document.addEventListener("pointermove",ev=>{
  if(!peint||!arme) return;
  const td=caseDe(document.elementFromPoint(ev.clientX,ev.clientY));
  if(td) appliquer(td);
});
const finPeinture=()=>{ if(peint){peint=false;dejaPeint.clear();rendre();} };
document.addEventListener("pointerup",finPeinture);
document.addEventListener("pointercancel",finPeinture);
let alertePart=false;
function appliquer(td){
  const k=td.dataset.e+"|"+td.dataset.d+"|"+td.dataset.p;
  if(dejaPeint.has(k)) return;
  if(arme.kind==="fav" && partAttendue(arme.debut)!==td.dataset.p){
    if(!alertePart){ alertePart=true;
      toast("Ce créneau démarre à "+arme.debut+", il relève du service du "+partAttendue(arme.debut)); }
    return;
  }
  dejaPeint.add(k);
  let val=null;
  if(arme.kind==="abs") val={type:arme.type};
  else if(arme.kind==="fav"){
    const e=emp(td.dataset.e);
    val={type:"travail",debut:arme.debut,fin:arme.fin,pause:arme.pause||0,poste:e.poste||""};
  }
  ecrireCreneau(td.dataset.e,td.dataset.d,td.dataset.p,val);
  td.innerHTML=chip(val);
}

let cible=null;
function ouvrirCreneau(td){
  cible={e:td.dataset.e,d:td.dataset.d,p:td.dataset.p};
  const e=emp(cible.e), ex=lireCreneau(cible.e,cible.d,cible.p);
  const s=ex||{type:"travail",debut:"11:50",fin:"15:00",pause:10,poste:e.poste||""};
  $("#shTitle").textContent=nomComplet(e);
  $("#shSub").textContent=dLong(dateDe(cible.d))+" · "+cible.p;
  $("#shTypes").innerHTML=Object.entries(TYPES).map(([k,v])=>
    `<button class="chipbtn${k===s.type?" on":""}" data-t="${k}">${v.lab}</button>`).join("");
  $$("#shTypes .chipbtn").forEach(b=>b.onclick=()=>{
    $$("#shTypes .chipbtn").forEach(x=>x.classList.remove("on")); b.classList.add("on"); majZone();});
  $("#shPoste").innerHTML=ST.cfg.postes.map(p=>`<option${p===(s.poste||e.poste)?" selected":""}>${esc(p)}</option>`).join("");
  $("#shStart").value=s.debut||"11:50"; $("#shEnd").value=s.fin||"15:00";
  $("#shPause").value=s.pause??10; $("#shNote").value=s.note||"";
  $("#shDelete").style.display=ex?"":"none";
  majZone(); $("#dlgShift").showModal();
}
const typeChoisi=()=>{const b=$("#shTypes .chipbtn.on");return b?b.dataset.t:"travail"};
function majZone(){const t=typeChoisi();$("#shWork").style.display=t==="travail"?"":"none";if(t==="travail")majDur()}
function majDur(){$("#shDur").value=fmt(duree({type:"travail",debut:$("#shStart").value,fin:$("#shEnd").value,pause:+$("#shPause").value||0}))}
["#shStart","#shEnd","#shPause"].forEach(s=>$(s).addEventListener("input",majDur));
$("#shSave").onclick=()=>{
  const t=typeChoisi(), note=$("#shNote").value.trim();
  if(t==="travail" && partAttendue($("#shStart").value)!==cible.p)
    return toast("Un créneau démarrant à "+$("#shStart").value+" relève du service du "
                 +partAttendue($("#shStart").value)+", pas du "+cible.p);
  const v = t==="travail"
    ? {type:"travail",debut:$("#shStart").value,fin:$("#shEnd").value,pause:+$("#shPause").value||0,poste:$("#shPoste").value,note}
    : {type:t,note};
  if(!v.note) delete v.note;
  ecrireCreneau(cible.e,cible.d,cible.p,v); $("#dlgShift").close(); rendre();
};
$("#shDelete").onclick=()=>{ecrireCreneau(cible.e,cible.d,cible.p,null);$("#dlgShift").close();rendre()};

   22. FICHE SALARIÉ
   ============================================================ */
let empEdit=null;
function ouvrirEmp(id){
  empEdit=id;
  const e=id?emp(id):{poste:ST.cfg.postes[0],service:ST.cfg.services[0],contrat:2100,type:"CDI"};
  $("#empTitle").textContent=id?"Fiche de "+nomComplet(e):"Nouveau salarié";
  $("#eNom").value=e.nom||""; $("#ePrenom").value=e.prenom||"";
  $("#ePoste").innerHTML=ST.cfg.postes.map(p=>`<option${p===e.poste?" selected":""}>${esc(p)}</option>`).join("");
  $("#eService").innerHTML=ST.cfg.services.map(s=>`<option${s===e.service?" selected":""}>${esc(s)}</option>`).join("");
  $("#eContrat").value=fmt(e.contrat||0);
  $("#eType").value=e.type||"CDI";
  $("#eOrdre").value=e.ordre??((Math.max(0,...listeEmployes().map(x=>x.ordre??0))+10));
  $("#eTel").value=e.tel||""; $("#eMail").value=e.email||"";
  $("#eNaiss").value=e.naissance||""; $("#eEmb").value=e.embauche||"";
  $("#eEssai").value=e.finEssai||""; $("#eFin").value=e.finContrat||""; $("#eVisite").value=e.visite||"";
  $("#eNote").value=e.note||"";
  $("#empDelete").style.display=id?"":"none";
  $("#dlgEmp").showModal();
}
function lireContrat(v){
  const m=String(v).match(/(\d+)\s*[h:]\s*(\d+)?/i);
  return m?(+m[1])*60+(+(m[2]||0)):Math.round(parseFloat(String(v).replace(",","."))*60)||0;
}
$("#empSave").onclick=()=>{
  const e={
    nom:$("#eNom").value.trim().toUpperCase(), prenom:$("#ePrenom").value.trim(),
    poste:$("#ePoste").value, service:$("#eService").value,
    contrat:lireContrat($("#eContrat").value), type:$("#eType").value,
    ordre:+$("#eOrdre").value||0,
    tel:$("#eTel").value.trim(), email:$("#eMail").value.trim(),
    naissance:$("#eNaiss").value, embauche:$("#eEmb").value,
    finEssai:$("#eEssai").value, finContrat:$("#eFin").value, visite:$("#eVisite").value,
    note:$("#eNote").value.trim()
  };
  Object.keys(e).forEach(k=>{ if(e[k]==="") delete e[k]; });
  if(!e.nom) return toast("Le nom est obligatoire");
  const id=empEdit||uid();
  ST.employes[id]=e; ecrireEmploye(id,e);
  tracer((empEdit?"Modification":"Création")+" du salarié "+nomComplet(e));
  $("#dlgEmp").close(); rendre(); toast("Fiche enregistrée");
};
$("#empDelete").onclick=()=>{
  const e=emp(empEdit);
  if(!confirm("Retirer "+nomComplet(e)+" de l'équipe ? Ses créneaux passés restent dans la base.")) return;
  delete ST.employes[empEdit]; ecrireEmploye(empEdit,null);
  tracer("Retrait du salarié "+nomComplet(e));
  $("#dlgEmp").close(); rendre();
};
$("#empCancel").onclick=()=>$("#dlgEmp").close();

/* ============================================================
   23. EN-TÊTE
   ============================================================ */
async function testerEcriture(){
  if(!FB) return "bibliothèque Firebase non chargée";
  const id="test-"+uid();
  try{
    await FB.set(FB.ref(FB.db,dbNode+"/traces/"+id),
      {ts:Date.now(),qui:user.nom,role:user.role,quoi:"Test d'écriture"});
    await FB.remove(FB.ref(FB.db,dbNode+"/traces/"+id));
    return "écriture acceptée";
  }catch(e){ return "refusée — "+((e&&e.message)||"raison inconnue"); }
}
async function ouvrirDiagnostic(){
  infoDlg("Synchronisation",`<p class="muted" style="margin:0">Test des adresses en cours…</p>`);
  const res=await sonderTout();
  const lignes=res.map(r=>`<tr>
    <td style="word-break:break-all;font-size:11.5px">${esc(r.url)}</td>
    <td style="color:${r.ok?"var(--vert)":r.txt.includes("règles")?"var(--accent)":"var(--rouge)"}">${esc(r.txt)}</td>
    <td>${r.url===dbUrl?'<span class="muted">actuelle</span>'
        :r.ok?`<button class="btn sm" data-url="${esc(r.url)}">Utiliser</button>`:""}</td></tr>`).join("");
  $("#infoBody").innerHTML=`
    <p style="margin:0;line-height:1.7">
      Bibliothèque Firebase : <b>${FB?"chargée":"non chargée"}</b><br>
      Connexion temps réel : <b style="color:${enLigne?"var(--vert)":"var(--rouge)"}">${enLigne?"établie":"absente"}</b><br>
      Nœud interrogé : <b>${esc(dbNode)}</b><br>
      Version du fichier : <b>${VERSION}</b></p>
    <div class="tbwrap"><table class="tb"><thead><tr><th>Adresse testée</th><th>Réponse</th><th></th></tr></thead>
      <tbody>${lignes}</tbody></table></div>
    <p class="warnbox" style="margin:0">« Adresse correcte, règles à publier » signifie que la base existe mais que le nœud
      « ${esc(dbNode)} » n'est pas encore autorisé. Collez le fichier de règles dans la console Firebase puis publiez.
      « Injoignable » sur toutes les lignes signifie que l'adresse ne correspond à aucune base, souvent une question de région.</p>`;
  $$("#infoBody [data-url]").forEach(b=>b.onclick=()=>{
    dbUrl=b.dataset.url; LS.set("db",dbUrl);
    toast("Adresse enregistrée, rechargement"); setTimeout(()=>location.reload(),700);
  });
  const zone=document.createElement("div");
  const err = derniereErreur
    ? `<p class="warnbox" style="margin:10px 0 0">Dernier refus, à ${new Date(derniereErreur.ts).toLocaleTimeString("fr-FR")}<br>
        Chemin : <b style="word-break:break-all">${esc(derniereErreur.chemin||"inconnu")}</b><br>
        Message : <b>${esc(derniereErreur.msg)}</b></p>` : "";
  zone.innerHTML=`<button class="btn" id="btnTestW">Tester une écriture</button>
    <span id="resTestW" class="muted" style="margin-left:10px"></span>${err}`;
  $("#infoBody").appendChild(zone);
  $("#btnTestW").onclick=async()=>{
    $("#resTestW").textContent="test en cours…";
    const r=await testerEcriture();
    const ok=r==="écriture acceptée";
    $("#resTestW").textContent=r;
    $("#resTestW").style.color=ok?"var(--vert)":"var(--rouge)";
  };
}
$("#btnSync").onclick=ouvrirDiagnostic;
