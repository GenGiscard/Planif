async function chargerSemaines(ids){
  const manquants=ids.filter(i=>!ST.cache[i]);
  if(!manquants.length) return;
  if(!FB){ manquants.forEach(i=>ST.cache[i]={}); return; }
  await Promise.all(manquants.map(async i=>{
    try{
      const lu = FB.get(FB.ref(FB.db,dbNode+"/semaines/"+i)).then(x=>x.val()||{});
      const v  = await Promise.race([lu, new Promise(r=>setTimeout(()=>r(null),7000))]);
      if(v===null){ cacheIncomplet=true; ST.cache[i]={}; } else ST.cache[i]=v;
    }catch(e){ cacheIncomplet=true; ST.cache[i]={}; }
  }));
}

function migrerPostes(){
  if(migrationFaite) return;
  let ch=false;
  if((ST.cfg.postes||[]).includes("Leader")){
    ST.cfg.postes=[...new Set(ST.cfg.postes.map(x=>x==="Leader"?"Responsable":x))];
    ch=true;
  }
  for(const [id,e] of Object.entries(ST.employes||{})){
    if(e.poste==="Leader"){ e.poste="Responsable"; ecrireEmploye(id,e); ch=true; }
  }
  const map=ST.cfg.posteService||{};
  let chMap=false;
  if(map.Leader){ map.Responsable=map.Responsable||map.Leader; delete map.Leader; chMap=true; }
  for(const pst of (ST.cfg.postes||[]))
    if(!map[pst]||!(ST.cfg.services||[]).includes(map[pst])){ map[pst]=devinerService(pst); chMap=true; }
  for(const k of Object.keys(map))
    if(!(ST.cfg.postes||[]).includes(k)){ delete map[k]; chMap=true; }
  if(chMap){ ST.cfg.posteService=map; ch=true; }
  if(ch){ migrationFaite=true; ecrireCfg(); }
}

  let t=0; for(const d of jours()){const dd=ymd(d);for(const p of PARTS)t+=duree(lireCreneau(id,dd,p.id));}
  return t;
}

function rendreMenu(){
  const q=($("#menuSearch").value||"").toLowerCase().trim();
  const corr=i=>!q||i.lab.toLowerCase().includes(q);
  let h="";
  const favs=favMenu.map(itemDe).filter(corr);
  const bloc=(titre,items,icone)=>items.length?`<div class="grp">
      <div class="grp-t"><span>${titre}</span>${icone||""}<i></i></div>
      ${items.map(i=>`<button class="mi${vue===i.id?" on":""}" data-go="${i.id}">
        ${ico(i.ic)}<span class="lab">${esc(i.lab)}</span>
        <span class="star${favMenu.includes(i.id)?" on":""}" data-fav="${i.id}" role="button" title="Favori">${ico("heart","ic sm")}</span>
      </button>`).join("")}</div>`:"";
  h+=`<div class="grp"><div class="grp-t"><span>Accueil</span><i></i></div>
      <button class="mi${vue==="accueil"?" on":""}" data-go="accueil">${ico("home")}<span class="lab">Tableau de bord</span></button></div>`;
  h+=bloc("Mes favoris",favs,ico("heart","ic sm"));
  for(const g of MENU) h+=bloc(g.t,g.items.filter(corr));
  $("#menu").innerHTML=h;
  $$("#menu [data-go]").forEach(b=>b.onclick=ev=>{
    if(ev.target.closest("[data-fav]")) return;
    aller(b.dataset.go);
  });
  $$("#menu [data-fav]").forEach(s=>s.onclick=ev=>{
    ev.stopPropagation();
    const id=s.dataset.fav;
    favMenu = favMenu.includes(id) ? favMenu.filter(x=>x!==id) : [...favMenu,id];
    LS.set("favMenu",favMenu); rendreMenu();

/* calendrier mensuel d'un salarié */
async function calendrierMois(id,an,mois){
  if(!id) return `<p class="muted">Aucun salarié enregistré.</p>`;
  const prem=new Date(an,mois,1), der=new Date(an,mois+1,0);
  const dep=lundiDe(prem);
  const nbSem=Math.ceil((joursEntre(ymd(dep),ymd(der))+1)/7);
  const ids=[]; for(let i=0;i<nbSem;i++){const d=new Date(dep);d.setDate(d.getDate()+i*7);ids.push(semId(d));}
  await chargerSemaines(ids);
  const today=ymd(new Date());
  let h=`<table class="cal"><thead><tr>`+JOURS.map(j=>`<th>${j.replace(".","")}</th>`).join("")+`</tr></thead><tbody>`;
  for(let s=0;s<nbSem;s++){
    h+="<tr>";
    for(let j=0;j<7;j++){
      const d=new Date(dep); d.setDate(d.getDate()+s*7+j);
      const dd=ymd(d), hors=d.getMonth()!==mois;
      let bars="";
      for(const p of PARTS){
        const c=creneauDe(id,dd,p.id); if(!c) continue;
        if(c.type==="travail") bars+=`<div class="cbar" style="background:${couleur(c.debut)}">${c.debut}-${c.fin} (${c.pause||0}')${c.poste?" "+esc(c.poste):""}</div>`;
        else bars+=`<div class="cbar" style="background:${TYPES[c.type].bg};color:${TYPES[c.type].fg}">${TYPES[c.type].code}${c.note?" "+esc(c.note):""}</div>`;
      }
      h+=`<td class="${hors?"off":""}${dd===today?" tdy":""}"><div class="dnum">${d.getDate()===1?MOIS[d.getMonth()].slice(0,4)+". ":""}${d.getDate()}</div>${bars}</td>`;
    }
    h+="</tr>";
  }
  return h+"</tbody></table>";
}

function chip(s,e){
  if(!s) return '<div class="cell-empty"></div>';
  if(s.type!=="travail"){
    const t=TYPES[s.type]||TYPES.RH;
    return `<div class="chip abs" style="background:${s.coul||t.bg};color:${t.fg}"
      title="${esc(t.lab)}${s.note?" — "+esc(s.note):""}">${t.code}${s.note?`<span class="note">${esc(s.note)}</span>`:""}</div>`;
  }
  const d=fmt(duree(s));
  const horsPoste = e && s.poste && e.poste && s.poste!==e.poste;
  const ti=`${s.debut}-${s.fin} · pause ${s.pause||0} min · ${d}`
    +(s.poste?" · "+s.poste+(horsPoste?" (poste inhabituel, habituellement "+e.poste+")":""):"")
    +(s.note?" — "+s.note:"");
  const fond=s.coul||couleur(s.debut);
  const note=s.note?`<span class="note">${esc(s.note)}</span>`:"";
  if(colSerre) return `<div class="chip${horsPoste?" horsposte":""}" style="background:${fond}" title="${esc(ti)}">
    <span class="h">${s.debut}</span><span class="h" style="opacity:.72">${s.fin}</span>${note}</div>`;
  return `<div class="chip${horsPoste?" horsposte":""}" style="background:${fond}" title="${esc(ti)}">
    <span class="h">${s.debut}-${s.fin}</span>
    <span class="p">${s.poste?(horsPoste?"&#9679; ":"")+esc(s.poste):d}</span>${note}</div>`;
}

function grilleSemaine(emps,js){
  const parts=partsVis(), today=ymd(new Date());

      }

function totauxGroupe(list,js,parts,srv){
  let eR="",hR="",tE=0,tH=0;

      hR+=`<td class="tot">${hh?fmt(hh):"—"}</td>`;

  return `<tr class="grouptot"><td class="name">Effectif présent</td>${eR}
    <td class="count"><div class="cnt"><span>Postes tenus</span><b>${tE}</b></div></td></tr>

}

VUES.timeline = ()=>{
  bar(barSemaine(filtresPlanning())+barJours());
  const emps=empVisibles(), js=jours();
  if(!emps.length) return page(etatVide());
  const H0=6, H1=26, N=H1-H0;
  const dd=ymd(js[jourActif]);
  const cols=`grid-template-columns:200px 1fr`;
  const heures=Array.from({length:N},(_,i)=>((H0+i)%24));
  let h=`<div class="card tl" style="overflow:hidden">
    <div class="tlhead" style="${cols}"><span style="border:none;padding-left:12px">Heure</span>
    <div style="display:grid;grid-template-columns:repeat(${N},1fr)">`+
    heures.map(x=>`<span>${pad(x)}h</span>`).join("")+`</div></div>`;
  const grp=parSecteur(emps,[js[jourActif]]);
  for(const srv of ST.cfg.services){
    const list=grp[srv]||[];
    if(!list.length) continue;
    h+=`<div class="mgtitle">${esc(srv)}</div>`;
    for(const e of list){
      let bars="";
      for(const p of PARTS){
        const c=creneauSecteur(e,dd,p.id,srv); if(!c) continue;
        if(c.type!=="travail"){ continue; }
        let a=toMin(c.debut)/60, b=toMin(c.fin)/60; if(b<=a)b+=24;
        const g=Math.max(H0,a), f=Math.min(H1,b);
        if(f<=g) continue;
        bars+=`<div class="tlbar" style="left:${(g-H0)/N*100}%;width:${(f-g)/N*100}%;background:${c.coul||couleur(c.debut)}"
          title="${c.debut}-${c.fin} · ${fmt(duree(c))}${c.note?" — "+esc(c.note):""}">${c.debut}-${c.fin}${c.note?" · "+esc(c.note):""}</div>`;
      }
      const abs=PARTS.map(p=>creneauSecteur(e,dd,p.id,srv)).find(c=>c&&c.type!=="travail");
      h+=`<div class="tlrow" style="${cols}"><div class="tlname"><div class="person">
        <span class="avatar" style="background:${avCol(e.id)}">${esc(initiales(e))}</span>
        <span class="pinfo"><b>${esc(nomComplet(e))}</b><span>${esc(postePourService(e,srv))}</span></span></div></div>
        <div class="tltrack"><div class="tlgrid" style="grid-template-columns:repeat(${N},1fr)">${"<i></i>".repeat(N)}</div>
        ${bars||(abs?`<div class="tlbar" style="left:2px;width:110px;background:${TYPES[abs.type].bg};color:${TYPES[abs.type].fg}">${TYPES[abs.type].lab}</div>`:"")}</div></div>`;
    }
  }
  page(wrapPad(h+`</div>`));
  const fs=$("#fService"),fp=$("#fPart");
  if(fs) fs.onchange=()=>{FILT.service=fs.value;rendre()};
  if(fp) fp.onchange=()=>{FILT.part=fp.value;rendre()};
};

function accepter(eid,id){
  const e={id:eid,...emp(eid)}, d=((ST.dem||{})[eid]||{})[id];
  if(!d) return;
  if(d.type==="indispo"){
    const parts=d.part?[d.part]:PARTS.map(p=>p.id);
    for(const p of parts) ecrireIndispo(eid,d.debut,p,{motif:d.note||"",ts:Date.now()});
    repondreDemande(e,id,"ok","");
    tracer("Indisponibilité acceptée pour "+nomComplet(e)+" le "+d.debut);
    rendre(); toast("Indisponibilité enregistrée");
    return;
  }
  const type = d.motif==="RTT"?"RTT":(d.motif==="SS"?"RH":"CP");
  let n=0;
  for(let x=dateDe(d.debut); x<=dateDe(d.fin); x.setDate(x.getDate()+1)){
    const dd=ymd(x);
    for(const p of PARTS) ecrireCreneau(eid,dd,p.id,{type,note:d.motif==="SS"?"sans solde":""});
    n++;
  }
  repondreDemande(e,id,"ok","");
  tracer("Congé accepté pour "+nomComplet(e)+" du "+d.debut+" au "+d.fin);
  rendre(); toast(n+" jour(s) posé(s) dans le planning");
}

async function copierPlanning(src,dst,kSrc,kDst,repet,ecraser){
  const lSrc=new Date(lundi); lSrc.setDate(lSrc.getDate()+kSrc*7);
  const sidSrc=semId(lSrc);
  const cibles=Array.from({length:repet},(_,r)=>{
    const d=new Date(lundi); d.setDate(d.getDate()+(kDst+r)*7); return d;
  });
  await chargerSemaines([sidSrc,...cibles.map(semId)]);
  const source=(semaineDe(sidSrc)[src])||{};
  const dates=Object.keys(source).sort();
  if(!dates.length) return 0;
  let total=0;
  for(const lCib of cibles){
    const sidCib=semId(lCib), patch={};
    const dejaLa=semaineDe(sidCib)[dst]||{};
    for(const dSrc of dates){
      const idx=joursEntre(ymd(lSrc),dSrc);
      if(idx<0||idx>6) continue;
      const dCib=new Date(lCib); dCib.setDate(dCib.getDate()+idx);
      const clef=ymd(dCib);
      for(const part of PARTS.map(x=>x.id)){
        const val=source[dSrc][part]; if(!val) continue;
        if(!ecraser && dejaLa[clef] && dejaLa[clef][part]) continue;
        patch[dst+"/"+clef+"/"+part]=val; total++;
        if(sidCib===semId(lundi)){
          (ST.sem[dst]||={}); (ST.sem[dst][clef]||={}); ST.sem[dst][clef][part]=val;
        }
        const c=ST.cache[sidCib]; if(c){ (c[dst]||={}); (c[dst][clef]||={}); c[dst][clef][part]=val; }
      }
    }
    if(Object.keys(patch).length) ecrireLot(sidCib,patch);
  }
  tracer("Copie du planning de "+nomComplet(emp(src))+" ("+sidSrc+") vers "
    +nomComplet(emp(dst))+" sur "+repet+" semaine(s) — "+total+" créneaux");
  return total;
}

function exportSemaine(){
  const L=[["Salarié","Poste","Service","Date","Jour","Créneau","Type","Début","Fin","Pause (min)","Heures payées"]];
  for(const e of listeEmployes()) for(const d of jours()) for(const p of PARTS){
    const s=lireCreneau(e.id,ymd(d),p.id); if(!s) continue;
    L.push([nomComplet(e),e.poste,e.service,ymd(d),JOURS[(d.getDay()||7)-1],p.lab,
      (TYPES[s.type]||{}).lab||s.type,s.debut||"",s.fin||"",s.pause??"",s.type==="travail"?fmt(duree(s)):""]);
  }
  csv(L,"planning-"+semId(lundi)+".csv");
}
function lignesPaye(){
  const r=R(), js=jours();
  return listeEmployes().map(e=>{
    let prevu=0,ret=0,nuit=0,fer=0,repas=0,jrs=0; const abs=[];
    for(const d of js){ const dd=ymd(d); let jm=0;
      for(const p of PARTS){
        const c=lireCreneau(e.id,dd,p.id); if(!c) continue;
        if(c.type!=="travail"){ if(c.type!=="RH") abs.push(c.type); continue; }
        prevu+=duree(c);
        const x=retenu(e.id,dd,p.id), m=minutesRetenues(x);
        ret+=m; jm+=m;
        nuit+=minutesNuit(x.debut,x.fin,r);
        if(ferie(dd)) fer+=m;
        repas += p.id==="midi"?r.repasMidi:r.repasSoir;
      }
      if(jm>0) jrs++;
    }
    const m=majorations(ret,e);
    const aPayer=m.lignes.reduce((n,l)=>n+(l.min-(l.incluses||0)),0);
    return {e,prevu,ret,nuit,fer,repas,jrs,maj:m,aPayer,abs:[...new Set(abs)]};
  });
}
function exportPaye(){
  const sid=semId(lundi), r=R();
  const L=[["Matricule","Salarié","Contrat hebdo","Jours travaillés","Heures planifiées","Heures retenues",
    "Écart","Type","Majorations","Dont incluses au contrat","À payer en plus",
    "Heures de nuit","Heures fériées","Repas","Valeur repas","Absences"]];
  for(const o of lignesPaye())
    L.push([o.e.id,nomComplet(o.e),fmt(o.e.contrat),o.jrs,fmt(o.prevu),fmt(o.ret),fmt(o.ret-o.prevu),
      o.maj.type,o.maj.lignes.map(l=>fmt(l.min)+" à "+l.taux+"%").join(" + "),
      fmt(o.maj.lignes.reduce((n,l)=>n+(l.incluses||0),0)),fmt(o.aPayer),
      fmt(o.nuit),fmt(o.fer),o.repas,r.valeurRepas||"",o.abs.join(" ")]);
  csv(L,"extraction-paye-"+sid+".csv");
}

      <td><input type="text" data-k="note" value="${esc(o.v.note||"")}" placeholder="—" style="min-width:130px"></td></tr>`).join("")
    : `<tr><td colspan="10" class="muted" style="padding:20px">Aucun salarié.</td></tr>`;
  page(wrapPad(h+`</tbody></table></div>
    <p class="muted" style="margin-top:10px;font-size:12px">
      Les repas sont comptés d'après les services travaillés, ${r.repasMidi} au midi et ${r.repasSoir} au soir.

      ${r.valeurRepas?"Valeur retenue : "+r.valeurRepas.toFixed(2)+" € l'unité.":"Renseignez la valeur du repas dans Règles de temps."}</p>`));
  $$("#viewbar [data-mo]").forEach(b=>b.onclick=()=>{
    moisVue+=+b.dataset.mo; if(moisVue<0){moisVue=11;anVue--} if(moisVue>11){moisVue=0;anVue++} rendre(); });
  $$("#page [data-evp]").forEach(tr=>{
    const id=tr.dataset.evp;

      "Heures fériées","Repas comptés","Repas retenus","Valeur repas","Prime","Acompte","Commentaire"],
    ...L.map(o=>[nomComplet(o.e),cle,o.jours,fmt(o.min),fmt(o.nuit),fmt(o.fer),o.repas,
      o.v.repas??o.repas,r.valeurRepas||"",o.v.prime??"",o.v.acompte??"",o.v.note||""])],"evp-"+cle+".csv");
};

function absHTML(){

    return `<button class="fav${on?" sel":""}" data-abs="${k}" style="background:${t.bg};color:${t.fg}">

function brancherRail(){
  const r=$("#rail"); if(!r) return;
  $$("[data-fav]",r).forEach(b=>b.onclick=ev=>{
    if(ev.target.closest("[data-delfav]")) return;
    const f=listeFavoris().find(x=>x.id===b.dataset.fav); if(!f) return;
    armer(arme&&arme.kind==="fav"&&arme.id===f.id?null:{kind:"fav",id:f.id,debut:f.debut,fin:f.fin,pause:f.pause});
  });
  $$("[data-delfav]",r).forEach(x=>x.onclick=ev=>{
    ev.stopPropagation();
    delete ST.cfg.favoris[x.dataset.delfav];
    if(arme&&arme.id===x.dataset.delfav) arme=null;
    ecrireCfg(); rendre();
  });
  $$("[data-abs]",r).forEach(b=>b.onclick=()=>{
    const k=b.dataset.abs;
    armer(arme&&arme.kind==="abs"&&arme.type===k?null:{kind:"abs",type:k});
  });
  const g=$("[data-gomme]",r); if(g) g.onclick=()=>armer(arme&&arme.kind==="gomme"?null:{kind:"gomme"});
  $$("[data-gm]",r).forEach(b=>b.onclick=()=>{
    modeGlisse=b.dataset.gm; LS.set("modeGlisse",modeGlisse);
    $$("[data-gm]",r).forEach(x=>x.classList.toggle("on",x.dataset.gm===modeGlisse));
  });
  $("#disarm").onclick=()=>armer(null);
  $("#railClose").onclick=()=>r.classList.remove("open");
  $("#railPin").onclick=()=>{
    railPin=!railPin; LS.set("railPin",railPin); r.classList.remove("open"); rendre();
  };
  $("#addFav").onclick=()=>{
    const d=$("#favStart").value,f=$("#favEnd").value,p=+$("#favPause").value||0;
    if(!d||!f) return toast("Renseignez une heure de début et de fin");
    if(listeFavoris().some(x=>x.debut===d&&x.fin===f&&x.pause===p)) return toast("Ce créneau existe déjà");
    ST.cfg.favoris[uid()]={debut:d,fin:f,pause:p};
    ecrireCfg(); rendre(); toast("Créneau ajouté");
  };
  $("#resetFav").onclick=()=>{
    ST.cfg.favoris=favDefaut(); arme=null; ecrireCfg(); rendre();
  };
}
function armer(a){

  const b=$("#armedBanner");
  if(b){
    b.classList.toggle("on",!!a);
    if(a) $("#armedText").textContent=texteArme();
  }

  if(r){ $("#absRow").innerHTML=absHTML(); $("#favGrid").innerHTML=favHTML(); brancherRail(); }

$("#fabFav").onclick=()=>{const r=$("#rail"); if(r) r.classList.toggle("open")};

/* ============================================================
   20. SAISIE : PEINTURE ET GLISSER-DÉPOSER
   ============================================================ */
let peint=false; const dejaPeint=new Set();
let alertePart=false;
const caseDe = el => (el&&el.closest) ? el.closest("td.cell,.mcell") : null;
const SEUIL_GLISSE=6;
let amorce=null, glisse=null, survole=null;

function appliquer(td){
  const k=td.dataset.e+"|"+td.dataset.d+"|"+td.dataset.p;
  if(dejaPeint.has(k)) return;
  if(arme.kind==="fav" && partAttendue(arme.debut)!==td.dataset.p){
    if(!alertePart){ alertePart=true;
      toast("Ce créneau démarre à "+arme.debut+", il relève du service du "+partAttendue(arme.debut)); }
    return;
  }
  dejaPeint.add(k);
  if(lireIndispo(td.dataset.e,td.dataset.d,td.dataset.p) && arme.kind==="fav" && !alertePart){
    alertePart=true; toast(nomComplet(emp(td.dataset.e))+" s'est déclaré indisponible sur ce service");
  }
  let val=null;
  const e={id:td.dataset.e,...emp(td.dataset.e)};
  if(arme.kind==="abs") val={type:arme.type};
  else if(arme.kind==="fav"){
    val={type:"travail",debut:arme.debut,fin:arme.fin,pause:arme.pause||0,
         poste:postePourService(e,td.dataset.srv)};
  }
  ecrireCreneau(td.dataset.e,td.dataset.d,td.dataset.p,val);
  td.innerHTML=chip(val,e);
}

/* ---------- description de ce que l'on déplace ---------- */
function etiquette(g){
  if(g.kind==="fav") return g.debut+" – "+g.fin;
  if(g.kind==="abs") return TYPES[g.type].lab;
  if(g.kind==="gomme") return "Effacer";
  return g.val.type==="travail" ? g.val.debut+" – "+g.val.fin : TYPES[g.val.type].lab;
}
function teinte(g){
  if(g.kind==="fav") return couleur(g.debut);
  if(g.kind==="abs") return TYPES[g.type].bg;
  if(g.kind==="gomme") return "transparent";
  return g.val.type==="travail" ? (g.val.coul||couleur(g.val.debut)) : TYPES[g.val.type].bg;
}
const dupliquer = ev => {
  const inv = !!(ev && (ev.ctrlKey||ev.metaKey||ev.altKey));
  return modeGlisse==="dupliquer" ? !inv : inv;
};
function sourceFav(b){
  if(b.dataset.fav){
    const f=listeFavoris().find(x=>x.id===b.dataset.fav);
    return f ? {kind:"fav",id:f.id,debut:f.debut,fin:f.fin,pause:f.pause} : null;
  }
  if(b.dataset.abs) return {kind:"abs",type:b.dataset.abs};
  if(b.dataset.gomme) return {kind:"gomme"};
  return null;
}

/* ---------- fantôme suivant le pointeur ---------- */
function montrerFantome(g,x,y){
  const f=document.createElement("div");
  f.className="dragghost";
  f.innerHTML=`<span class="dgp" style="background:${teinte(g)}"></span>
    <b>${esc(etiquette(g))}</b><em></em>`;
  document.body.appendChild(f);
  g.ghost=f; g.lab=f.querySelector("em");
  bougerFantome(g,x,y,null);
}
function bougerFantome(g,x,y,ev){
  if(!g.ghost) return;
  g.ghost.style.left=x+"px"; g.ghost.style.top=y+"px";
  if(g.lab) g.lab.textContent = g.kind==="cell" ? (dupliquer(ev)?"dupliquer":"déplacer")
                              : g.kind==="gomme" ? "vider" : "poser";
}
function surligner(td,ok){
  if(survole===td){ if(td){td.classList.toggle("survol",ok);td.classList.toggle("refus",!ok);} return; }
  if(survole) survole.classList.remove("survol","refus");
  survole=td||null;
  if(td){ td.classList.add(ok?"survol":"refus"); }
}
function compatible(g,td){
  if(!td) return false;
  if(g.kind==="gomme"||g.kind==="abs") return true;
  const dep = g.kind==="fav" ? g.debut : (g.val.type==="travail"?g.val.debut:null);
  return dep===null || partAttendue(dep)===td.dataset.p;
}
/* défilement automatique près des bords pendant le glissement */
function autoDefil(x,y){
  const z=document.querySelector(".gridwrap"); if(!z) return;
  const r=z.getBoundingClientRect(), m=54, pas=18;
  if(x>r.right-m) z.scrollLeft+=pas; else if(x<r.left+m) z.scrollLeft-=pas;
  if(y>r.bottom-m) z.scrollTop+=pas; else if(y<r.top+m) z.scrollTop-=pas;
}

/* ---------- dépôt ---------- */
function deposer(td,ev){
  const g=glisse, e={id:td.dataset.e,...emp(td.dataset.e)}, srv=td.dataset.srv||"";
  if(g.kind==="gomme"){ ecrireCreneau(td.dataset.e,td.dataset.d,td.dataset.p,null); return true; }
  if(g.kind==="abs"){ ecrireCreneau(td.dataset.e,td.dataset.d,td.dataset.p,{type:g.type}); return true; }
  if(g.kind==="fav"||g.kind==="cell"){
    if(lireIndispo(td.dataset.e,td.dataset.d,td.dataset.p))
      toast(nomComplet(e)+" s'est déclaré indisponible sur ce service");
  }
  if(g.kind==="fav"){
    if(partAttendue(g.debut)!==td.dataset.p){
      toast("Ce créneau démarre à "+g.debut+", il relève du service du "+partAttendue(g.debut)); return false; }
    ecrireCreneau(td.dataset.e,td.dataset.d,td.dataset.p,
      {type:"travail",debut:g.debut,fin:g.fin,pause:g.pause||0,poste:postePourService(e,srv)});
    return true;
  }
  if(g.e===td.dataset.e && g.d===td.dataset.d && g.p===td.dataset.p) return false;
  const v={...g.val};
  if(v.type==="travail"){
    if(partAttendue(v.debut)!==td.dataset.p){
      toast("Ce créneau démarre à "+v.debut+", il relève du service du "+partAttendue(v.debut)); return false; }
    if(srv && serviceDuPoste(v.poste)!==srv) v.poste=postePourService(e,srv);
  }
  ecrireCreneau(td.dataset.e,td.dataset.d,td.dataset.p,v);
  if(!dupliquer(ev)) ecrireCreneau(g.e,g.d,g.p,null);
  return true;
}
function finGlisse(){
  if(glisse&&glisse.ghost) glisse.ghost.remove();
  if(glisse&&glisse.src) glisse.src.classList.remove("origine");
  if(survole) survole.classList.remove("survol","refus");
  survole=null; glisse=null; amorce=null;
  document.body.classList.remove("glisse");
}

/* ---------- événements ---------- */
document.addEventListener("pointerdown",ev=>{
  if(ev.button) return;
  const b=ev.target.closest&&ev.target.closest("#rail .fav");
  if(b){
    if(ev.target.closest("[data-delfav]")) return;
    if(ev.pointerType==="touch") return;            /* au doigt : le panneau reste défilable */
    amorce={x:ev.clientX,y:ev.clientY,src:b,faire:()=>sourceFav(b)};
    return;
  }
  const td=caseDe(ev.target); if(!td) return;
  if(arme){ ev.preventDefault(); peint=true; alertePart=false; dejaPeint.clear(); appliquer(td); return; }
  const e={id:td.dataset.e,...emp(td.dataset.e)};
  const c=creneauSecteur(e,td.dataset.d,td.dataset.p,td.dataset.srv||"");
  amorce={x:ev.clientX,y:ev.clientY,src:td,td,
    faire: c ? ()=>({kind:"cell",e:td.dataset.e,d:td.dataset.d,p:td.dataset.p,val:c,src:td}) : null};
});
document.addEventListener("pointermove",ev=>{
  if(peint&&arme){
    const td=caseDe(document.elementFromPoint(ev.clientX,ev.clientY));
    if(td) appliquer(td);
    return;
  }
  if(amorce&&!glisse){
    if(Math.abs(ev.clientX-amorce.x)<SEUIL_GLISSE && Math.abs(ev.clientY-amorce.y)<SEUIL_GLISSE) return;
    if(!amorce.faire){ amorce=null; return; }
    glisse=amorce.faire();
    if(!glisse){ amorce=null; return; }
    if(glisse.src) glisse.src.classList.add("origine");
    document.body.classList.add("glisse");
    montrerFantome(glisse,ev.clientX,ev.clientY);
  }
  if(glisse){
    ev.preventDefault();
    bougerFantome(glisse,ev.clientX,ev.clientY,ev);
    autoDefil(ev.clientX,ev.clientY);
    if(glisse.ghost) glisse.ghost.style.visibility="hidden";
    const td=caseDe(document.elementFromPoint(ev.clientX,ev.clientY));
    if(glisse.ghost) glisse.ghost.style.visibility="";
    surligner(td,compatible(glisse,td));
  }
});
document.addEventListener("pointerup",ev=>{
  if(peint){ peint=false; dejaPeint.clear(); amorce=null; rendre(); return; }
  if(glisse){
    if(glisse.ghost) glisse.ghost.style.visibility="hidden";
    /* au doigt, la position de relâchement est parfois inexploitable :
       on retombe sur la dernière case survolée */
    const td=caseDe(document.elementFromPoint(ev.clientX,ev.clientY))||survole;
    const fait = td ? deposer(td,ev) : false;
    finGlisse();
    window.addEventListener("click",e=>{e.stopPropagation();e.preventDefault();},{capture:true,once:true});
    if(fait) rendre();
    return;
  }
  if(amorce&&amorce.td
     && Math.abs(ev.clientX-amorce.x)<SEUIL_GLISSE && Math.abs(ev.clientY-amorce.y)<SEUIL_GLISSE){
    const td=amorce.td; amorce=null; ouvrirCreneau(td); return;
  }
  amorce=null;
});
document.addEventListener("pointercancel",()=>{
  if(peint){ peint=false; dejaPeint.clear(); rendre(); }
  if(glisse) finGlisse(); else amorce=null;
});

let cible=null;
function ouvrirCreneau(td){
  cible={e:td.dataset.e,d:td.dataset.d,p:td.dataset.p,srv:td.dataset.srv||""};
  const e={id:cible.e,...emp(cible.e)}, ex=lireCreneau(cible.e,cible.d,cible.p);
  const s=ex||{type:"travail",debut:"11:50",fin:"15:00",pause:10,poste:postePourService(e,cible.srv)};
  $("#shTitle").textContent=nomComplet(e);
  $("#shSub").textContent=dLong(dateDe(cible.d))+" · "+cible.p+(cible.srv?" · "+cible.srv:"");
  $("#shTypes").innerHTML=Object.entries(TYPES).map(([k,v])=>
    `<button class="chipbtn${k===s.type?" on":""}" data-t="${k}">${v.lab}</button>`).join("");
  $$("#shTypes .chipbtn").forEach(b=>b.onclick=()=>{
    $$("#shTypes .chipbtn").forEach(x=>x.classList.remove("on")); b.classList.add("on"); majZone();});
  const choisi=s.poste||e.poste;
  $("#shPoste").innerHTML=ST.cfg.postes.map(p=>`<option${p===choisi?" selected":""}>${esc(p)}</option>`).join("");
  $("#shCoul").innerHTML=PALETTE.map(([lab,c])=>
    `<button type="button" class="swatch${(s.coul||"")===c?" on":""}" data-coul="${c}" title="${esc(lab)}"
      style="background:${c||"transparent"}">${c?"":"auto"}</button>`).join("");
  $$("#shCoul .swatch").forEach(b=>b.onclick=()=>{
    $$("#shCoul .swatch").forEach(x=>x.classList.remove("on")); b.classList.add("on"); });
  const majSrv=()=>{ const sv=serviceDuPoste($("#shPoste").value);
    $("#shSrv").textContent = sv ? "Ce poste place le salarié dans le secteur « "+sv+" »." : ""; };
  $("#shPoste").onchange=majSrv; majSrv();
  $("#shStart").value=s.debut||"11:50"; $("#shEnd").value=s.fin||"15:00";
  $("#shPause").value=s.pause??10; $("#shNote").value=s.note||"";
  $("#shDelete").style.display=ex?"":"none";
  majZone(); $("#dlgShift").showModal();
}
const typeChoisi=()=>{const b=$("#shTypes .chipbtn.on");return b?b.dataset.t:"travail"};
function majZone(){const t=typeChoisi();$("#shWork").style.display=t==="travail"?"":"none";if(t==="travail")majDur()}
function majDur(){$("#shDur").value=fmt(duree({type:"travail",debut:$("#shStart").value,fin:$("#shEnd").value,pause:+$("#shPause").value||0}))}
["#shStart","#shEnd","#shPause"].forEach(s=>$(s).addEventListener("input",majDur));
$("#shSave").onclick=()=>{
  const t=typeChoisi(), note=$("#shNote").value.trim();
  if(t==="travail" && partAttendue($("#shStart").value)!==cible.p)
    return toast("Un créneau démarrant à "+$("#shStart").value+" relève du service du "
                 +partAttendue($("#shStart").value)+", pas du "+cible.p);
  const sw=$("#shCoul .swatch.on");
  const coul=sw?sw.dataset.coul:"";
  const v = t==="travail"
    ? {type:"travail",debut:$("#shStart").value,fin:$("#shEnd").value,pause:+$("#shPause").value||0,
       poste:$("#shPoste").value,note,coul}
    : {type:t,note,coul};
  if(!v.note) delete v.note;
  if(!v.coul) delete v.coul;
  ecrireCreneau(cible.e,cible.d,cible.p,v); $("#dlgShift").close(); rendre();
};
$("#shDelete").onclick=()=>{ecrireCreneau(cible.e,cible.d,cible.p,null);$("#dlgShift").close();rendre()};
$("#shCancel").onclick=()=>$("#dlgShift").close();

function lireContrat(v){
  const m=String(v).match(/(\d+)\s*[h:]\s*(\d+)?/i);
  return m?(+m[1])*60+(+(m[2]||0)):Math.round(parseFloat(String(v).replace(",","."))*60)||0;
}

async function testerEcriture(){
  if(!FB) return "bibliothèque Firebase non chargée";
  const id="test-"+uid();
  try{
    await FB.set(FB.ref(FB.db,dbNode+"/traces/"+id),
      {ts:Date.now(),qui:user.nom,role:user.role,quoi:"Test d'écriture"});
    await FB.remove(FB.ref(FB.db,dbNode+"/traces/"+id));
    return "écriture acceptée";
  }catch(e){ return "refusée — "+((e&&e.message)||"raison inconnue"); }
}
async function ouvrirDiagnostic(){
  infoDlg("Synchronisation",`<p class="muted" style="margin:0">Test des adresses en cours…</p>`);
  const res=await sonderTout();

    <td style="word-break:break-all;font-size:11.5px">${esc(r.url)}</td>

  $$("#infoBody [data-url]").forEach(b=>b.onclick=()=>{

function ecranConnexion(msg){
  document.body.innerHTML=`<div class="connexion">

           $("#errCode").textContent="Code inconnu, ou connexion indisponible."; }

async function connecterMoi(){
  if(fbMoi) return fbMoi;
  if(!dbUrl) return null;
  try{
    const [A,D]=await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js")]);
    fbMoi={db:D.getDatabase(A.initializeApp({databaseURL:dbUrl},"moi"+Date.now())), ...D};
    return fbMoi;
  }catch(e){ return null; }
}
async function verifierCode(c){
  const f=await connecterMoi(); if(!f) return false;
  try{ return (await f.get(f.ref(f.db,nodePerso()+"/"+c+"/info"))).exists(); }
  catch(e){ return false; }
}
const cleMoi = sid => "moi:"+codeMoi+":"+sid;
function joursMoi(){ return Array.from({length:7},(_,i)=>{const d=new Date(lundiMoi);d.setDate(d.getDate()+i);return d}); }
const creneauMoi=(d,p)=>(semMoi[d]&&semMoi[d][p])||null;
const pointageMoi=(d,p)=>(pointMoi[d]&&pointMoi[d][p])||null;

async function demarrerMoi(){
  document.body.innerHTML=`<div class="etatsync" style="padding:40px 0">Chargement…</div>`;
  const sid=semId(lundiMoi);
  const cache=LS.get(cleMoi(sid),null);
  if(cache){ semMoi=cache.sem||{}; pointMoi=cache.point||{}; }
  infoMoi=infoMoi||LS.get("moi:info:"+codeMoi,null);
  if(!Object.keys(demMoi).length) demMoi=LS.get("moi:dem:"+codeMoi,{})||{};
  dessinerMoi();
  const f=await connecterMoi();
  if(!f){ majEtatMoi("Hors ligne, dernières données enregistrées sur ce téléphone"); return; }
  [uInfoMoi,uSemMoi,uPtMoi].forEach(u=>{ if(u){try{u()}catch(e){}} });
  const base=nodePerso()+"/"+codeMoi;
  uInfoMoi=f.onValue(f.ref(f.db,base+"/info"),s=>{
    infoMoi=s.val(); LS.set("moi:info:"+codeMoi,infoMoi); dessinerMoi(); },
    ()=>majEtatMoi("Accès refusé, demandez un nouveau code"));
  uSemMoi=f.onValue(f.ref(f.db,base+"/sem/"+sid),s=>{ semMoi=s.val()||{}; sauverMoi(sid); dessinerMoi(); });
  uPtMoi =f.onValue(f.ref(f.db,base+"/point/"+sid),s=>{ pointMoi=s.val()||{}; sauverMoi(sid); dessinerMoi(); });
  if(uDemMoi){try{uDemMoi()}catch(e){}}
  uDemMoi=f.onValue(f.ref(f.db,base+"/demandes"),s=>{
    demMoi=s.val()||{}; LS.set("moi:dem:"+codeMoi,demMoi); dessinerMoi(); });
}
const sauverMoi = sid => LS.set(cleMoi(sid),{sem:semMoi,point:pointMoi});
function majEtatMoi(t){ const e=$("#etatMoi"); if(e) e.textContent=t; }

function allerSemMoi(d){
  lundiMoi.setDate(lundiMoi.getDate()+d*7);
  semMoi={}; pointMoi={}; demarrerMoi();
}
function maintenantHM(){ const n=new Date(); return pad(n.getHours())+":"+pad(n.getMinutes()); }

async function ecrirePointage(dd,part,v){
  const sid=semId(dateDe(dd));
  if(v){ (pointMoi[dd]||={}); pointMoi[dd][part]=v; }
  else if(pointMoi[dd]) delete pointMoi[dd][part];
  sauverMoi(sid); dessinerMoi();
  const f=await connecterMoi(); if(!f) return;
  const r=f.ref(f.db,nodePerso()+"/"+codeMoi+"/point/"+sid+"/"+dd+"/"+part);
  try{ await (v?f.set(r,v):f.remove(r)); }
  catch(e){ majEtatMoi("Enregistrement impossible, réessayez quand le réseau revient"); }
}

async function envoyerDemande(d){
  const id=uid();
  demMoi[id]={...d,ts:Date.now(),etat:"attente"};
  LS.set("moi:dem:"+codeMoi,demMoi); dessinerMoi();
  const f=await connecterMoi();
  if(!f){ majEtatMoi("Demande enregistrée sur ce téléphone, elle partira au retour du réseau"); return; }
  try{ await f.set(f.ref(f.db,nodePerso()+"/"+codeMoi+"/demandes/"+id), demMoi[id]); }
  catch(e){ majEtatMoi("Envoi impossible, réessayez quand le réseau revient"); }
}
async function retirerDemande(id){
  delete demMoi[id]; LS.set("moi:dem:"+codeMoi,demMoi); dessinerMoi();
  const f=await connecterMoi(); if(!f) return;
  try{ await f.remove(f.ref(f.db,nodePerso()+"/"+codeMoi+"/demandes/"+id)); }catch(e){}
}

function dessinerMoi(){
  const js=joursMoi(), today=ymd(new Date());
  const nom=infoMoi?((infoMoi.prenom||"")+" "+(infoMoi.nom||"")).trim():"Mon planning";
  let prevuTot=0, pointeTot=0;
  let corps="";
  for(const d of js){
    const dd=ymd(d);
    let blocs="";
    for(const part of ["midi","soir"]){
      const c=creneauMoi(dd,part), pt=pointageMoi(dd,part);
      if(!c && !pt) continue;
      if(c && c.type!=="travail"){
        blocs+=`<div class="svc"><div class="repos" style="background:${TYPES[c.type].bg};color:${TYPES[c.type].fg};border-radius:6px">
          ${esc(TYPES[c.type].lab)}${c.note?" — "+esc(c.note):""}</div></div>`;
        continue;
      }
      const dp=c?duree(c):0; prevuTot+=dp;
      const dr=pt?duree({type:"travail",debut:pt.debut,fin:pt.fin,pause:pt.pause||0}):0;
      if(pt&&pt.debut&&pt.fin) pointeTot+=dr;
      const ec=(pt&&pt.debut&&pt.fin&&c)?dr-dp:null;
      const dj=joursEntre(dd,ymd(new Date()));   /* 0 aujourd'hui, 1 hier */
      const horodatable = dj>=0 && dj<=1;
      const suspect = pt&&pt.debut&&pt.fin&&c&&Math.abs(dr-dp)>180;
      blocs+=`<div class="svc">
        <div class="prevu">
          <span class="pastille" style="background:${c?(c.coul||couleur(c.debut)):"#e2e8ed"}">
            ${c?c.debut+" – "+c.fin:"hors planning"}</span>
          <span class="meta">${part==="midi"?"Midi":"Soir"}${c&&c.poste?" · "+esc(c.poste):""}${c?" · pause "+(c.pause||0)+" min · "+fmt(dp)+" prévues":""}</span>
          ${c&&c.note?`<span class="note">${esc(c.note)}</span>`:""}
        </div>
        <div class="pointbloc">
          <div class="ligne">
            <div><label>Arrivée</label><input type="time" data-pt="${dd}|${part}|debut" value="${pt?pt.debut||"":""}"></div>
            <div><label>Départ</label><input type="time" data-pt="${dd}|${part}|fin" value="${pt?pt.fin||"":""}"></div>
            <div><label>Pause</label><input type="number" min="0" max="240" step="5"
                 data-pt="${dd}|${part}|pause" value="${pt?(pt.pause??(c?c.pause||0:0)):(c?c.pause||0:0)}"></div>
          </div>
          ${horodatable?`<div class="rapide">
            <button data-top="${dd}|${part}|debut"${pt&&pt.debut?" disabled":""}>Je prends mon service</button>
            <button class="sec" data-top="${dd}|${part}|fin"${!(pt&&pt.debut)||(pt&&pt.fin)?" disabled":""}>Je termine</button>
          </div>`:""}
          ${suspect?`<div class="alerte">Écart important avec le prévu, vérifiez les heures saisies.</div>`:""}
          <div class="bilan">
            <span>${pt&&pt.debut&&pt.fin?"Pointé <b>"+fmt(dr)+"</b>":"Pas encore pointé"}</span>
            ${ec!==null?`<span>Écart <b class="${ec>0?"plus":ec<0?"moins":""}">${ec>0?"+":""}${fmt(ec)}</b></span>`:""}
            ${pt?`<button class="linkbtn" data-eff="${dd}|${part}">Effacer</button>`:""}
          </div>
        </div></div>`;
    }
    if(!blocs) blocs=`<div class="svc"><div class="repos" style="color:var(--ink-3);font-weight:500">Aucun service prévu</div></div>`;
    corps+=`<section class="jour${dd===today?" aujourdhui":""}">
      <h3>${JOURS_L[(d.getDay()||7)-1]} ${d.getDate()} ${MOIS[d.getMonth()]}<em>${dd===today?"aujourd'hui":""}</em></h3>
      ${blocs}</section>`;
  }
  const ecTot=pointeTot-prevuTot;
  document.body.className="moi";
  document.body.innerHTML=`
    <div class="bandeau">
      <div class="qui"><b>${esc(nom)}</b>
        <span>${infoMoi?esc([infoMoi.poste,infoMoi.etab].filter(Boolean).join(" · ")):""}</span></div>
      <button class="sortie" id="btnAideMoi" aria-label="Comment ça marche">?</button>
      <button class="sortie" id="btnSortirMoi">Quitter</button>
    </div>
    <div class="aidemoi" id="aideMoi" hidden>
      <b>Comment ça marche</b>
      <ol>
        <li>En arrivant, appuyez sur <b>Je prends mon service</b>.</li>
        <li>En partant, appuyez sur <b>Je termine</b>.</li>

      <button class="${ongletMoi==="demandes"?"on":""}" data-og="demandes">Mes demandes${

    <main>

        <div><span>Pointé</span><b>${fmt(pointeTot)}</b></div>
        <div><span>Écart</span><b class="${ecTot>0?"plus":ecTot<0?"moins":""}">${ecTot>0?"+":""}${fmt(ecTot)}</b></div>
      </div>

}
function brancherMoi(){
  $$("[data-og]").forEach(b=>b.onclick=()=>{ ongletMoi=b.dataset.og; dessinerMoi(); });
  const zc=$("#zoneConge");
  if(zc){
    $$("[data-td]").forEach(b=>b.onclick=()=>{
      $$("[data-td]").forEach(x=>x.classList.toggle("on",x===b));
      const conge=b.dataset.td==="conge";
      $("#zoneConge").hidden=!conge; $("#zoneIndispo").hidden=conge;
    });
    $("#dEnvoi").onclick=()=>{
      const conge=$("[data-td].on").dataset.td==="conge";
      const note=$("#dNote").value.trim();
      if(conge){
        const a=$("#dDeb").value, b=$("#dFin").value;
        if(!a||!b) return majEtatMoi("Renseignez les deux dates.");
        if(b<a) return majEtatMoi("La date de fin précède la date de début.");
        envoyerDemande({type:"conge",debut:a,fin:b,motif:$("#dMotif").value,note});
      } else {
        const j=$("#iDate").value;
        if(!j) return majEtatMoi("Renseignez la date.");
        envoyerDemande({type:"indispo",debut:j,fin:j,part:$("#iPart").value,note});
      }
      majEtatMoi("Demande envoyée à votre responsable.");
    };
    $$("[data-annul]").forEach(b=>b.onclick=()=>{
      if(confirm("Annuler cette demande ?")) retirerDemande(b.dataset.annul);
    });
  }
  $$("[data-sm]").forEach(b=>b.onclick=()=>{
    const d=+b.dataset.sm;
    if(d===0) lundiMoi=lundiDe(new Date()); else lundiMoi.setDate(lundiMoi.getDate()+d*7);
    semMoi={}; pointMoi={}; demarrerMoi();
  });
  $$("[data-pt]").forEach(i=>i.onchange=()=>{
    const [dd,part,champ]=i.dataset.pt.split("|");
    const a=pointageMoi(dd,part)||{}, c=creneauMoi(dd,part);
    const v={debut:a.debut||"",fin:a.fin||"",pause:a.pause??(c&&c.type==="travail"?c.pause||0:0)};
    v[champ]= champ==="pause" ? (+i.value||0) : i.value;
    if(!v.debut&&!v.fin) return ecrirePointage(dd,part,null);
    v.ts=Date.now(); ecrirePointage(dd,part,v);
  });
  $$("[data-top]").forEach(b=>b.onclick=()=>{
    const [dd,part,champ]=b.dataset.top.split("|");
    const a=pointageMoi(dd,part)||{};
    const c=creneauMoi(dd,part);
    const v={debut:a.debut||"",fin:a.fin||"",pause:a.pause??(c?c.pause||0:0),ts:Date.now()};
    v[champ]=maintenantHM();
    ecrirePointage(dd,part,v);
  });
  $$("[data-eff]").forEach(b=>b.onclick=()=>{
    const [dd,part]=b.dataset.eff.split("|");
    if(confirm("Effacer ce pointage ?")) ecrirePointage(dd,part,null);
  });
  const aide=$("#aideMoi");
  if(aide && !LS.get("aideVue",false)) aide.hidden=false;
  $("#btnAideMoi").onclick=()=>{ aide.hidden=!aide.hidden; };
  $("#aideFermer").onclick=()=>{ aide.hidden=true; LS.set("aideVue",true); };
  $("#btnSortirMoi").onclick=()=>{
    if(!confirm("Quitter votre espace sur cet appareil ? Le code sera redemandé.")) return;
    LS.set("verrouSalarie",false); LS.set("moncode","");
    location.hash=""; location.reload();
  };
}

/* ============================================================
   24. DÉMARRAGE
   ============================================================ */
document.documentElement.dataset.theme=theme;
const mMoi=(location.hash||"").match(/^#\/moi(?:\/([A-Za-z0-9]{4,12}))?/i);
if(mMoi || LS.get("verrouSalarie",false)){
  if(mMoi && mMoi[1]){ codeMoi=mMoi[1].toUpperCase(); LS.set("moncode",codeMoi); LS.set("verrouSalarie",true); }
  history.replaceState(null,"",location.pathname+"#/moi");
  if(codeMoi) demarrerMoi(); else ecranConnexion();
} else {
$("#vTag").textContent=VERSION.split(" ")[0];
chargerMirroir();
const dep=(location.hash||"").replace("#/","");
if(dep&&(dep==="accueil"||TOUS.some(i=>i.id===dep))) vue=dep;
rendreMenu();
rendre();
initFirebase();
chargerMeteo().then(()=>{ if(vue==="accueil") rendre(); });
}
</script>
