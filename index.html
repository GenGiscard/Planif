<!DOCTYPE html>
<html lang="fr" data-theme="clair">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Kik Planif'</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Cpath d=%27M12.5 8V3M27.5 8V3%27 stroke=%27%232f6f9f%27 stroke-width=%273.4%27 stroke-linecap=%27round%27/%3E%3Crect x=%273%27 y=%276%27 width=%2734%27 height=%2731%27 rx=%277%27 fill=%27%23e8763f%27/%3E%3Cpath d=%27M13 20v12M13 26l6.5-6M13 26l7 6%27 stroke=%27white%27 stroke-width=%273.2%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3Crect x=%2724%27 y=%2720.4%27 width=%279%27 height=%272.8%27 rx=%271.4%27 fill=%27white%27/%3E%3Crect x=%2724%27 y=%2725.4%27 width=%276%27 height=%272.8%27 rx=%271.4%27 fill=%27white%27 fill-opacity=%27.6%27/%3E%3C/svg%3E">
<style>
:root{
  --ink:#233043; --ink-2:#5a6b7d; --ink-3:#8496a6;
  --paper:#f2f4f7; --card:#ffffff; --card-2:#f8fafb;
  --line:#dde3e9; --line-2:#c3ced8;
  --accent:#e8763f; --accent-2:#f0f6ff;
  --bleu:#2f6f9f; --vert:#2f8f5b; --rouge:#c0392b; --violet:#7a5ba6;
  --side:#ffffff; --side-txt:#3c4b5c; --side-hi:#f3f6f9;
  --r:6px; --safe-b:env(safe-area-inset-bottom,0px);
  --colw:106px; --namew:236px; --countw:150px;
  --sidew:238px;
}
html[data-theme=sombre]{
  --ink:#e6ecf2; --ink-2:#a8b6c4; --ink-3:#7d8d9c;
  --paper:#141c25; --card:#1b2530; --card-2:#212d3a;
  --line:#2e3d4d; --line-2:#3d5062;
  --accent:#f08a55; --accent-2:#22303f;
  --side:#1b2530; --side-txt:#c2ced9; --side-hi:#25323f;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font:13.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--bleu)}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg.ic{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
svg.ic.sm{width:16px;height:16px}
svg.ic.lg{width:24px;height:24px}

/* ============ ossature ============ */
.shell{display:flex;height:100%}
.main{flex:1;display:flex;flex-direction:column;min-width:0}

/* ============ barre latérale ============ */
#sidebar{width:var(--sidew);flex:none;background:var(--side);border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:60}
.sidehead{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
.logo{display:flex;align-items:center;gap:9px;min-width:0}
.logo .glyph{width:34px;height:34px;flex:none}
.logo b{font-size:17px;letter-spacing:.14em;font-weight:700;color:var(--ink);white-space:nowrap;line-height:1}
.logo b span{font-weight:300;color:var(--accent);margin-left:.28em;letter-spacing:.13em}
.pin{margin-left:auto;color:var(--ink-3);padding:4px}
.pin.on{color:var(--accent)}
.sidesearch{position:relative;padding:0 14px 10px}
.sidesearch svg{position:absolute;left:24px;top:50%;transform:translateY(-60%);color:var(--ink-3)}
.sidesearch input{width:100%;border:none;border-bottom:1px solid var(--line);background:transparent;
  padding:7px 4px 7px 28px;font-size:13.5px}
.sidesearch input::placeholder{color:var(--ink-3)}
.sidescroll{flex:1;overflow-y:auto;padding-bottom:24px}
.grp{margin-top:14px}
.grp-t{display:flex;align-items:center;gap:10px;padding:0 16px 6px;color:var(--accent);font-size:14px}
.grp-t span{white-space:nowrap}
.grp-t i{flex:1;height:1px;background:var(--line);display:block}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:9px 16px;color:var(--side-txt);
  text-align:left;font-size:13.5px;position:relative}
.mi:hover{background:var(--side-hi)}
.mi.on{background:var(--side-hi);color:var(--ink);font-weight:600}
.mi.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.mi .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .star{opacity:0;color:var(--ink-3);padding:2px}
.mi:hover .star{opacity:1}
.mi .star.on{opacity:1;color:var(--accent)}
.scrim{display:none;position:fixed;inset:0;background:rgba(15,25,35,.45);z-index:55}

/* ============ en-tête ============ */
.topbar{height:58px;flex:none;display:flex;align-items:center;gap:16px;padding:0 18px;
  background:var(--card);border-bottom:1px solid var(--line)}
.etab{line-height:1.2;min-width:0}
.etab b{display:block;font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etab span{display:block;font-size:11.5px;color:var(--ink-2);letter-spacing:.06em}
.spacer{flex:1}
.tico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);position:relative}
.tico:hover{background:var(--card-2);color:var(--ink)}
.tico.ring{border:2px solid var(--accent);color:var(--accent)}
.tico .badge{position:absolute;top:1px;right:1px;min-width:15px;height:15px;border-radius:8px;
  background:var(--accent);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.who{display:flex;align-items:center;gap:9px}
.who b{font-size:14.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.who .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;
  font-size:12px;font-weight:700;background:var(--bleu)}
.burger{display:none;color:var(--ink-2);padding:6px}
.tutobtn{display:flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:none;
  border-radius:16px;padding:7px 14px;font-size:13px;font-weight:650;box-shadow:0 2px 7px rgba(232,118,63,.3);
  margin-left:4px;flex:none}
.tutobtn:hover{filter:brightness(1.07)}
.tutobox{position:fixed;inset:0;z-index:300;background:rgba(16,26,36,.55);display:flex;
  align-items:center;justify-content:center;padding:18px}
.tutobox[hidden]{display:none}
.tutoint{background:var(--card);border-radius:11px;width:min(960px,100%);height:min(88vh,920px);
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 54px rgba(12,22,32,.42)}
.tutobar{display:flex;align-items:center;gap:11px;padding:11px 15px;border-bottom:1px solid var(--line);
  background:var(--card)}
.tutobar b{font-size:14px;font-weight:650;flex:1}
.tutoint iframe{flex:1;border:none;width:100%;background:var(--paper)}

/* ============ barre de vue ============ */
#viewbar{flex:none;background:var(--card);border-bottom:1px solid var(--line);padding:9px 18px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:50px}
#viewbar:empty{display:none}
.vtitle{font-size:15px;font-weight:650;margin-right:4px}
.wk{display:flex;align-items:center;gap:6px}
.wk .num{font-size:18px;font-weight:700;color:var(--accent);min-width:48px;text-align:center}
.nav{width:30px;height:30px;border:1px solid var(--line);border-radius:var(--r);display:grid;place-items:center;
  color:var(--ink-2);background:var(--card)}
.nav:hover{background:var(--card-2)}
.range{color:var(--ink-2);font-size:12.5px}
label.fl{color:var(--ink-2);font-size:12.5px}
select,input[type=text],input[type=time],input[type=date],input[type=number],input[type=url],input[type=email],input[type=tel]{
  border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:6px 8px;color:var(--ink)}
textarea{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:7px;
  color:var(--ink);font:inherit;width:100%}
.btn{border:1px solid var(--line-2);background:var(--card);padding:7px 13px;border-radius:var(--r);color:var(--ink)}
.btn:hover{background:var(--card-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{border-color:#e3b6b0;color:var(--rouge)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.chipbtn{border:1px solid var(--line);border-radius:14px;padding:5px 12px;font-size:12.5px;background:var(--card)}
/* --- glisser-déposer --- */
.dragghost{position:fixed;z-index:200;pointer-events:none;transform:translate(-50%,-150%);
  display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:6px;background:var(--card);
  border:1px solid var(--line-2);box-shadow:0 8px 22px rgba(12,22,32,.32);
  font-size:11.5px;font-weight:650;white-space:nowrap;color:var(--ink)}
.dragghost .dgp{width:13px;height:13px;border-radius:3px;border:1px solid rgba(0,0,0,.18);flex:none}
.dragghost em{font-style:normal;font-weight:500;color:var(--ink-2);font-size:10.5px}
td.cell.survol,.mcell.survol{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-2)!important}
td.cell.refus,.mcell.refus{outline:2px dashed var(--rouge);outline-offset:-2px}
td.cell.origine .chip,.mcell.origine .chip{opacity:.3}
body.glisse{user-select:none;-webkit-user-select:none;cursor:grabbing}
.chip{cursor:grab}
.glissemode{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:0 0 8px;
  font-size:10.5px;color:var(--ink-2)}
.glissemode span{width:100%}
.gm{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:3px 9px;font-size:10.5px;flex:1}
.gm.on{background:var(--ink);border-color:var(--ink);color:var(--card);font-weight:650}
.railhint{font-size:10.5px;line-height:1.35;color:var(--ink-3);margin:0 0 8px}
@media (min-width:1001px){ .chip,.fav{touch-action:none} }
@media (max-width:1000px){ body:not(.vsem) .chip{touch-action:none} .fav{touch-action:pan-y} }
.ano{display:inline-block;border:1px solid;border-radius:10px;padding:1px 8px;font-size:10.5px;
  font-weight:600;white-space:nowrap;margin:1px 0}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatch{width:36px;height:28px;border-radius:5px;border:1px solid var(--line-2);font-size:9px;color:var(--ink-2)}
.swatch.on{outline:2px solid var(--ink);outline-offset:1px}
.chipbtn.on{background:var(--ink);border-color:var(--ink);color:var(--card);font-weight:600}
.sync{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);white-space:nowrap;
  padding:5px 9px;border-radius:14px}
.sync:hover{background:var(--card-2)}
.dot{width:8px;height:8px;border-radius:50%;background:#95a3b0;flex:none}
.dot.on{background:#3fae72} .dot.off{background:#e0a13c}

/* ============ page ============ */
#page{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
.pad{padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px}
.h2{font-size:15px;font-weight:650;margin:0 0 10px}
.muted{color:var(--ink-2)}
.empty{padding:38px 20px;color:var(--ink-2);max-width:46ch}
.empty h2{margin:0 0 6px;font-size:15px;color:var(--ink)}
.empty p{margin:0 0 14px}

/* accueil */
.today{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;text-align:center;margin-bottom:16px}
.today b{display:block;font-size:17px;font-weight:600}
.today span{color:var(--ink-2)}
.rappels{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:16px}
.rap{display:flex;align-items:center;gap:14px;padding:14px 16px}
.rap .ico{position:relative;color:var(--ink-2)}
.rap .ico b{position:absolute;top:-5px;right:-7px;min-width:17px;height:17px;border-radius:9px;font-size:10px;
  display:grid;place-items:center;color:#fff;background:#3fae72;font-weight:700;padding:0 4px}
.rap .ico b.hot{background:var(--accent)}
.rap .tx{flex:1;min-width:0;line-height:1.3}
.rap .tx b{display:block;font-size:14px;font-weight:650}
.rap .tx span{font-size:12px;color:var(--ink-2)}
.rap .go{color:var(--ink-3);padding:6px}
.meteo{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;overflow-x:auto;margin-bottom:16px}
.met{border-right:1px solid var(--line);padding:10px 8px;text-align:center;min-width:104px}
.met:last-child{border-right:none}
.met b{display:block;font-size:13px;font-weight:650;margin-bottom:6px;white-space:nowrap}
.met .tmp{display:flex;justify-content:center;gap:10px;font-weight:700;font-size:13px;margin-top:6px}
.met .tmp .mn{color:var(--bleu)} .met .tmp .mx{color:var(--rouge)}
.met svg{color:var(--ink-2)}

/* calendrier mois */
.cal{width:100%;border-collapse:collapse;table-layout:fixed}
.cal th{padding:8px 4px;font-size:12.5px;color:var(--ink-2);font-weight:500;border-bottom:1px solid var(--line)}
.cal td{border:1px solid var(--line);vertical-align:top;padding:4px;height:86px;background:var(--card)}
.cal td.off{background:var(--card-2)}
.cal .dnum{font-size:12.5px;color:var(--ink-2);text-align:right;padding:0 2px 3px}
.cal td.tdy .dnum{background:var(--accent);color:#fff;border-radius:11px;width:22px;height:22px;
  display:grid;place-items:center;margin-left:auto;padding:0}
.cbar{border-radius:3px;padding:2px 5px;font-size:11px;margin-bottom:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;color:#16212e}

/* tableaux génériques */
table.tb{width:100%;border-collapse:collapse;background:var(--card)}
table.tb th{text-align:left;font-size:12px;color:var(--ink-2);font-weight:600;padding:9px 10px;
  border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--card);z-index:2}
table.tb td{padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
table.tb tr:hover td{background:var(--card-2)}
table.tb input,table.tb select{width:100%;padding:5px 6px;font-size:12.5px}
table.tb td.num{text-align:right;font-variant-numeric:tabular-nums}

/* ============ grille planning ============ */
.planwrap{display:flex;height:100%;min-height:0}
.gridwrap{flex:1;overflow:auto;background:var(--card)}
body.paint td.cell,body.paint .mcell{touch-action:none}
table.pl{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
table.pl th,table.pl td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0}
th.day{background:var(--card);position:sticky;top:0;z-index:5;text-align:center;font-weight:600;
  font-size:12.5px;color:var(--ink-2);padding:7px 4px 3px;border-bottom:none}
th.day.today{color:var(--accent)}
th.part{background:var(--card);position:sticky;top:29px;z-index:5;font-weight:500;font-size:11.5px;
  color:var(--ink-3);padding:3px 4px 6px;width:var(--colw);min-width:var(--colw);border-bottom:1px solid var(--line-2)}
th.part.we,th.day.we{background:var(--card-2)}
th.corner{position:sticky;left:0;top:0;z-index:7;background:var(--card);width:var(--namew);min-width:var(--namew);
  border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);text-align:left;
  padding:8px 12px;font-weight:600;color:var(--ink-2);font-size:12px}
th.cornerc{position:sticky;right:0;top:0;z-index:7;background:var(--card);width:var(--countw);min-width:var(--countw);
  border-bottom:1px solid var(--line-2);border-left:1px solid var(--line-2);font-size:12px;
  color:var(--ink-2);font-weight:600;padding:8px 10px;text-align:left}
tr.grouprow td{background:var(--card-2);border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.grouphead{position:sticky;left:0;z-index:4;background:var(--card-2);display:flex;align-items:center;gap:8px;
  padding:6px 12px;font-weight:700;letter-spacing:.05em;font-size:12px}
.grouphead .count{font-weight:400;color:var(--ink-2);letter-spacing:0}
td.name{position:sticky;left:0;z-index:3;background:var(--card);width:var(--namew);min-width:var(--namew);
  border-right:1px solid var(--line-2);padding:5px 10px 5px 12px}
tr:hover td.name{background:var(--card-2)}
.person{display:flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:#fff}
.pinfo{min-width:0;line-height:1.28}
.pinfo b{display:block;font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo>span{display:block;font-size:11px;color:var(--ink-2)}
.pinfo em{font-style:normal;color:var(--ink-3)}
.rowedit{margin-left:auto;color:var(--ink-3);padding:2px 4px;visibility:hidden}
tr:hover .rowedit,.mrow .rowedit{visibility:visible}
td.cell{width:var(--colw);min-width:var(--colw);height:46px;padding:2px;background:var(--card);cursor:pointer}
td.cell.we{background:var(--card-2)}
td.cell.indispo,.mcell.indispo{background:repeating-linear-gradient(135deg,
  transparent,transparent 5px,rgba(192,57,43,.14) 5px,rgba(192,57,43,.14) 10px)}
td.cell.indispo::after,.mcell.indispo::after{content:"indisponible";position:absolute;
  font-size:8.5px;color:var(--rouge);font-weight:650;pointer-events:none;
  margin:-2px 0 0 2px;letter-spacing:-.2px}
td.cell,.mcell{position:relative}
.chip{height:100%;border-radius:3px;padding:3px 5px;display:flex;flex-direction:column;justify-content:center;
  gap:1px;overflow:hidden;border:1px solid rgba(0,0,0,.10);color:#16212e}
.chip .h{font-size:11.5px;font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip .p{font-size:10px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.82}
.chip.abs{align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.04em}
.chip .note{font-size:9.5px;line-height:1.2;font-weight:600;opacity:.95;white-space:normal;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  border-top:1px solid rgba(0,0,0,.16);margin-top:1px;padding-top:1px}
.chip.abs .note{border:none;margin:0;padding:0;font-weight:500;font-size:9px;letter-spacing:0}
.chip.horsposte{box-shadow:inset 3px 0 0 #2b3a4a}
.chip.horsposte .p{font-weight:700}
td.cell{height:auto;min-height:48px}
.chip{min-height:42px}
.cell-empty{height:100%;min-height:40px;border-radius:3px;border:1px dashed transparent}
td.cell:hover .cell-empty{border-color:var(--line-2);background:var(--card-2)}
tr.invite td.name{background:repeating-linear-gradient(135deg,var(--card),var(--card) 7px,var(--card-2) 7px,var(--card-2) 14px)}
tr.grouptot td{background:var(--card-2);border-bottom:1px solid var(--line-2);font-size:11.5px;color:var(--ink-2)}
tr.grouptot td.name{background:var(--card-2);padding:5px 12px;font-weight:600}
td.tot{text-align:center;padding:4px 2px;font-variant-numeric:tabular-nums}
td.tot b{display:block;font-size:12px;color:var(--ink)}
td.count{position:sticky;right:0;z-index:3;background:var(--card);width:var(--countw);min-width:var(--countw);
  border-left:1px solid var(--line-2);padding:4px 10px}
tr:hover td.count{background:var(--card-2)}
tr.grouptot td.count{background:var(--card-2)}
.cnt{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--ink-2);line-height:1.5}
.cnt b{font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums}
.cnt b.over{color:var(--rouge)} .cnt b.under{color:var(--bleu)}

/* vue journée */
.mday{display:none}
.mgtitle{position:sticky;top:0;z-index:2;background:var(--card-2);padding:7px 12px;font-weight:700;
  font-size:12px;letter-spacing:.05em;border-bottom:1px solid var(--line-2);display:flex;gap:8px}
.mgtitle .count{font-weight:400;color:var(--ink-2);letter-spacing:0;margin-left:auto}

<script>const TUTO_HTML = "<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Kik Planif' — mode d'emploi<\/title>\n<style>\n:root{\n  --ink:#233043; --ink2:#5a6b7d; --ink3:#8496a6;\n  --paper:#f2f4f7; --card:#fff; --card2:#f8fafb;\n  --line:#dde3e9; --line2:#c3ced8;\n  --org:#e8763f; --bleu:#2f6f9f; --vert:#2f8f5b; --rouge:#c0392b;\n  --r:7px;\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{margin:0;background:var(--paper);color:var(--ink);\n  font:15px/1.55 -apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,sans-serif;\n  -webkit-font-smoothing:antialiased}\n.wrap{max-width:860px;margin:0 auto;padding:0 18px 70px}\n\n/* ---------- en-tête ---------- */\nheader{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}\n.hd{max-width:860px;margin:0 auto;padding:13px 18px;display:flex;align-items:center;gap:11px;flex-wrap:wrap}\n.hd .mark{display:flex;align-items:center;gap:9px}\n.hd .mark b{font-size:16px;letter-spacing:.13em;font-weight:700}\n.hd .mark b span{font-weight:300;color:var(--org);margin-left:.26em}\n.hd .ss{font-size:13px;color:var(--ink2);border-left:1px solid var(--line);padding-left:11px}\n.pas{display:flex;gap:5px;flex-wrap:wrap;max-width:860px;margin:0 auto;padding:0 18px 10px}\n@media (max-width:640px){.pas{flex-wrap:nowrap;overflow-x:auto}}\n.pas a{flex:0 0 auto;font-size:12.5px;text-decoration:none;color:var(--ink2);border:1px solid var(--line);\n  border-radius:14px;padding:4px 11px;background:var(--card);white-space:nowrap}\n.pas a:hover{border-color:var(--org);color:var(--org)}\n.pas a b{color:var(--org)}\n\n.intro{padding:26px 0 8px}\n.intro h1{font-size:25px;margin:0 0 8px;letter-spacing:-.01em}\n.intro p{margin:0;color:var(--ink2);max-width:62ch}\n\n/* ---------- étapes ---------- */\nsection.etape{margin-top:34px;scroll-margin-top:96px}\n.titre{display:flex;align-items:baseline;gap:11px;margin-bottom:5px}\n.num{flex:none;width:27px;height:27px;border-radius:50%;background:var(--org);color:#fff;\n  display:grid;place-items:center;font-size:13px;font-weight:700;align-self:center}\n.titre h2{font-size:18px;margin:0;font-weight:650}\n.but{color:var(--ink2);margin:0 0 13px 38px;font-size:14px}\n.scene{background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden;position:relative}\n.ecran{position:relative;background:var(--card2);min-height:232px;padding:15px;overflow:hidden}\n.barre{display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);\n  background:var(--card);font-size:12.5px}\n.barre .leg{flex:1;color:var(--ink2);min-height:18px}\n.rejouer{border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:15px;\n  padding:4px 13px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px}\n.rejouer:hover{border-color:var(--org);color:var(--org)}\n.retenir{margin:11px 0 0 38px;font-size:13.5px;color:var(--ink2)}\n.retenir b{color:var(--ink)}\n.retenir ul{margin:5px 0 0;padding-left:17px}\n.retenir li{margin-bottom:3px}\n\n/* ---------- curseur ---------- */\n.cur{position:absolute;width:21px;height:21px;z-index:20;pointer-events:none;opacity:0;\n  transition:transform .62s cubic-bezier(.4,.1,.25,1),opacity .2s;transform:translate(0,0)}\n.cur svg{display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}\n.cur.on{opacity:1}\n.cur.clic::after{content:\"\";position:absolute;left:-8px;top:-8px;width:34px;height:34px;border-radius:50%;\n  border:2px solid var(--org);animation:pulse .45s ease-out}\n@keyframes pulse{from{transform:scale(.3);opacity:.9}to{transform:scale(1);opacity:0}}\n\n/* ---------- maquette du planning ---------- */\n.mk{display:flex;gap:9px;align-items:flex-start}\n.mkgrid{flex:1;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:11px}\n.mkhead{display:grid;background:var k;font-weight:700;font-variant-numeric:tabular-nums}\n.fav i{font-style:normal;opacity:.75;font-size:8.5px}\n.fav.actif{outline:2px solid var(--ink);outline-offset:1px}\n.fantome{position:absolute;z-index:19;display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:5px;\n  background:var(--card);border:1px solid var(--line2);box-shadow:0 5px 15px rgba(12,22,32,.3);\n  font-size:10px;font-weight:650;white-space:nowrap;opacity:0;transition:transform .62s cubic-bezier(.4,.1,.25,1),opacity .18s}\n.fantome .pt{width:10px;height:10px;border-radius:2px;border:1px solid rgba(0,0,0,.15)}\n.fantome em{font-style:normal;font-weight:500;color:var(--ink2);font-size:9px}\n.fantome.on{opacity:1}\n\n/* ---------- boutons et éléments d'appli ---------- */\n.bt{border:1px solid var(--line2);background:var(--card);border-radius:5px;padding:5px 11px;font-size:11.5px;\n  display:inline-flex;align-items:center;gap:6px}\n.bt.org{background:var(--org);border-color:var(--org);color:#fff;font-weight:650}\n.bt.vert{background:var(--vert);border-color:var(--vert);color:#fff;font-weight:650}\n.bt.gris{opacity:.55}\n.toast{position:absolute;left:50%;bottom:13px;transform:translateX(-50%) translateY(8px);background:#233043;\n  color:#fff;padding:7px 14px;border-radius:5px;font-size:11.5px;opacity:0;transition:.26s;z-index:22;white-space:nowrap}\n.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}\n.tbl{width:100%;border-collapse:collapse;background:var(--card);font-size:11px;\n  border:1px solid var(--line);border-radius:6px;overflow:hidden}\n.tbl th{text-align:left;padding:6px 9px;font-size:10px;color:var(--ink2);border-bottom:1px solid var(--line2);font-weight:650}\n.tbl td{padding:6px 9px;border-bottom:1px solid var(--line)}\n.tbl tr:last-child td{border-bottom:none}\n.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.11em;font-weight:700;font-size:12px}\n.etq{display:inline-block;border-radius:10px;padding:1px 8px;font-size:9.5px;font-weight:700}\n.etq.dec{background:#fdeee3;color:#9c4a16}\n.etq.val{background:#e3f3ea;color:#1d6b41}\n\n/* ---------- téléphone ---------- */\n.tel{width:188px;margin:0 auto;border:7px solid #1b2530;border-radius:21px;overflow:hidden;background:var(--card);\n  box-shadow:0 7px 22px rgba(12,22,32,.22)}\n.telbar{background:#1b2530;color:#fff;padding:6px 9px;font-size:10px;line-height:1.25}\n.telbar b{display:block;font-size:11px}\n.telbar span{color:#9db0c0;font-size:8.5px}\n.telc{padding:8px;min-height:188px}\n.telj{border:1px solid var(--line);border-radius:6px;margin-bottom:6px;overflow:hidden}\n.telj h5{margin:0;padding:4px 8px;font-size:10px;background:var(--card2);border-bottom:1px solid var(--line);font-weight:650}\n.telj.auj h5{background:var(--org);color:#fff}\n.telsvc{padding:7px 8px}\n.telprev{display:flex;gap:5px;align-items:center;margin-bottom:6px;flex-wrap:wrap}\n.telprev .p{border-radius:3px;padding:2px 6px;font-size:10px;font-weight:700;color:#16212e;border:1px solid rgba(0,0,0,.12)}\n.telprev em{font-style:normal;font-size:8.5px;color:var(--ink2)}\n.telpt{background:var(--card2);border-radius:5px;padding:6px}\n.telch{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:5px}\n.telch div span{display:block;font-size:8px;color:var(--ink2);font-weight:650}\n.telch div b{display:block;background:var(--card);border:1px solid var(--line2);border-radius:4px;\n  padding:4px;text-align:center;font-size:11px;font-variant-numeric:tabular-nums;font-weight:600;min-height:21px}\n.telbt{display:flex;gap:5px}\n.telbt button{flex:1;border:1px solid var(--org);background:var(--org);color:#fff;border-radius:4px;\n  padding:6px 3px;font-size:9.5px;font-weight:650;cursor:default}\n.telbt button.sec{background:var(--card);color:var(--org)}\n.telbt button.off{opacity:.4}\n.telbil{font-size:9px;color:var(--ink2);margin-top:5px;display:flex;justify-content:space-between}\n.telbil b{color:var(--ink)}\n.telcx{padding:22px 14px;text-align:center}\n.telcx p{font-size:9.5px;color:var(--ink2);margin:0 0 10px;line-height:1.4}\n.telcx .zone{border:1px solid var(--line2);border-radius:5px;padding:9px;font-size:15px;letter-spacing:.2em;\n  font-weight:700;text-align:center;min-height:38px;background:var(--card)}\n.telcx .zone.vide{color:var(--ink3);letter-spacing:.1em;font-size:11px;font-weight:400}\n\n/* ---------- règles et anomalies ---------- */\n.regl{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}\n.regl .b{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px}\n.regl .b span{display:block;font-size:9.5px;color:var(--ink2);font-weight:650}\n.regl .b b{display:block;font-size:16px;font-variant-numeric:tabular-nums}\n.flux{display:grid;grid-template-columns:1fr 26px 1fr;gap:7px;align-items:center;\n  background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px;\n  opacity:0;transform:translateY(6px);transition:.3s}\n.flux.on{opacity:1;transform:none}\n.flux i{font-style:normal;font-size:9.5px;color:var(--ink2);display:block}\n.flux b{font-size:13px;font-variant-numeric:tabular-nums}\n.flux .fl{text-align:center;color:var(--org);font-size:15px}\n.flux .res b{color:var(--vert)}\n.ano{display:inline-block;border:1px solid;border-radius:9px;padding:1px 7px;font-size:9px;font-weight:700;white-space:nowrap}\n.ano.ret{background:#fdeee3;color:#9c4a16;border-color:#edc7aa}\n.ano.dep{background:#e7eff6;color:#1d4e75;border-color:#bcd2e4}\n.ano.rep{background:#fbe6e3;color:#8d2a1e;border-color:#edbcb5}\n.tr{display:inline-block;background:#eef3f7;border:1px solid var(--line2);border-radius:9px;\n  padding:1px 7px;font-size:9.5px;font-weight:650;margin-right:3px}\n.jauge{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:3px}\n.jauge i{display:block;height:100%;background:var(--org);width:0;transition:width .8s}\n\n/* ---------- demandes ---------- */\n.dmd{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:9px 11px;\n  margin-bottom:7px;opacity:0;transform:translateY(6px);transition:.3s;display:flex;align-items:center;gap:9px}\n.dmd.on{opacity:1;transform:none}\n.dmd .tx{flex:1;min-width:0}\n.dmd .tx b{display:block;font-size:11.5px}\n.dmd .tx i{font-style:normal;font-size:9.5px;color:var(--ink2)}\n.dmd .et{font-size:9.5px;font-weight:700;white-space:nowrap}\n.sol{display:inline-block;background:#e4f3ea;color:#1d6b41;border:1px solid #bddecb;\n  border-radius:9px;padding:1px 7px;font-size:9.5px;font-weight:700}\n.sol.bas{background:#fdeee3;color:#9c4a16;border-color:#edc7aa}\n\n/* ---------- dépannage ---------- */\n.depan{margin-top:40px}\n.depan h2{font-size:18px;margin:0 0 12px}\ntable.pb{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);\n  border-radius:9px;overflow:hidden;font-size:13.5px}\ntable.pb th{text-align:left;padding:9px 13px;font-size:12px;color:var(--ink2);\n  border-bottom:1px solid var(--line2);font-weight:650}\ntable.pb td{padding:9px 13px;border-bottom:1px solid var(--line);vertical-align:top}\ntable.pb tr:last-child td{border-bottom:none}\ntable.pb td:first-child{font-weight:600;width:40%}\n.fin{margin-top:26px;font-size:13px;color:var(--ink2);text-align:center}\n\n@media (prefers-reduced-motion:reduce){ .cur,.fantome{transition:none} .puce.nait{animation:none} }\n@media (max-width:620px){\n  .wrap{padding:0 12px 50px}\n  .mkrail{width:92px}\n  .but,.retenir{margin-left:0}\n  .ecran{padding:11px}\n  table.pb td:first-child{width:auto}\n  table.pb,table.pb tbody,table.pb tr,table.pb td{display:block}\n  table.pb thead{display:none}\n  table.pb tr{border-bottom:1px solid var(--line2);padding:4px 0}\n  table.pb td{border:none;padding:3px 13px}\n  table.pb td:first-child{padding-top:9px}\n}\n<\/style>\n<\/head>\n<body>\n<header>\n  <div class=\"hd\">\n    <span class=\"mark\">\n      <svg width=\"27\" height=\"27\" viewBox=\"0 0 40 40\" fill=\"none\" aria-hidden=\"true\">\n        <path d=\"M12.5 8V3M27.5 8V3\" stroke=\"#2f6f9f\" stroke-width=\"3.4\" stroke-linecap=\"round\"/>\n        <rect x=\"3\" y=\"6\" width=\"34\" height=\"31\" rx=\"7\" fill=\"#e8763f\"/>\n        <path d=\"M13 20v12M13 26l6.5-6M13 26l7 6\" stroke=\"#fff\" stroke-width=\"2.9\"\n              stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n      <b>KIK<span>PLANIF'<\/span><\/b><\/span>\n    <span class=\"ss\">Mode d'emploi<\/span>\n  <\/div>\n  <nav class=\"pas\">\n    <a href=\"#e1\"><b>1<\/b> Poser les créneaux<\/a>\n    <a href=\"#e2\"><b>2<\/b> Déplacer, dupliquer<\/a>\n    <a href=\"#e3\"><b>3<\/b> Reprendre une semaine<\/a>\n    <a href=\"#e4\"><b>4<\/b> Valider et imprimer<\/a>\n    <a href=\"#e5\"><b>5<\/b> Donner un accès<\/a>\n    <a href=\"#e6\"><b>6<\/b> Le salarié pointe<\/a>\n    <a href=\"#e7\"><b>7<\/b> Récupérer les heures<\/a>\n    <a href=\"#e8\"><b>8<\/b> Règles de calcul<\/a>\n    <a href=\"#e9\"><b>9<\/b> Anomalies et heures sup.<\/a>\n    <a href=\"#e10\"><b>10<\/b> Compteurs et variables<\/a>\n    <a href=\"#e11\"><b>11<\/b> Congés et demandes<\/a>\n    <a href=\"#pb\">Dépannage<\/a>\n  <\/nav>\n<\/header>\n\n<div class=\"wrap\">\n  <div class=\"intro\">\n    <h1>Onze gestes pour tenir le planning<\/h1>\n    <p>Chaque étape est montrée en animation. Appuyez sur Rejouer pour revoir un geste.<\/p>\n  <\/div>\n\n  <!-- 1 -->\n  <section class=\"etape\" id=\"e1\">\n    <div class=\"titre\"><span class=\"num\">1<\/span><h2>Poser les créneaux<\/h2><\/div>\n    <p class=\"but\">Planifier mon service, le panneau des créneaux est à droite.<\/p>\n    <div class=\"scene\" data-scene=\"s1\">\n      <div class=\"ecran\" id=\"s1\">\n        <div class=\"mk\">\n          <div class=\"mkgrid\" id=\"g1\"><\/div>\n          <div class=\"mkrail\">\n            <h4>CRÉNEAUX<\/h4>\n            <div class=\"fav\" id=\"f1a\" style=\"background:#f2a4b8\"><b>11:50 – 15:00<\/b><i>pause 10 min<\/i><\/div>\n            <div class=\"fav\" id=\"f1b\" style=\"background:#f4b782\"><b>18:50 – 23:00<\/b><i>pause 10 min<\/i><\/div>\n            <div class=\"fav\" id=\"f1c\" style=\"background:#d8dde1\"><b>RH<\/b><i>Repos<\/i><\/div>\n          <\/div>\n        <\/div>\n        <div class=\"fantome\" id=\"fa1\"><span class=\"pt\"><\/span><b><\/b><em>poser<\/em><\/div>\n        <div class=\"cur\" id=\"c1\"><svg viewBox=\"0 0 20 20\"><path d=\"M2 1l6.5 16 2.3-6.4 6.4-2.3z\" fill=\"#fff\" stroke=\"#233043\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><\/svg><\/div>\n      <\/div>\n      <div class=\"barre\"><span class=\"leg\" id=\"l1\"><\/span>\n        <button class=\"rejouer\" data-play=\"s1\">Rejouer<\/button><\/div>\n    <\/div>\n    <div class=\"retenir\"><b>À retenir.<\/b>\n      <ul><li>Glisser un créneau du panneau le pose sur la case.<\/li>\n      <li>Un clic dessus le garde actif : les cases suivantes se remplissent d'un simple passage.<\/li>\n      <li>Un créneau du soir est refusé sur une case de midi.<\/li><\/ul><\/div>\n  <\/section>\n\n  <!-- 2 -->\n  <section class=\"etape\" id=\"e2\">\n    <div class=\"titre\"><span class=\"num\">2<\/span><h2>Déplacer ou dupliquer<\/h2><\/div>\n    <p class=\"but\">Un créneau déjà posé se rattrape à la souris comme au doigt.<\/p>\n    <div class=\"scene\" data-scene=\"s2\">\n      <div class=\"ecran\" id=\"s2\">\n        <div class=\"mk\"><div class=\"mkgrid\" id=\"g2\"><\/div><\/div>\n        <div class=\"fantome\" id=\"fa2\"><span class=\"pt\"><\/span><b><\/b><em>dupliquer<\/em><\/div>\n        <div class=\"cur\" id=\"c2\"><svg viewBox=\"0 0 20 20\"><path d=\"M2 1l6.5 16 2.3-6.4 6.4-2.3z\" fill=\"#fff\" stroke=\"#233043\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><\/svg><\/div>\n      <\/div>\n      <div class=\"barre\"><span class=\"leg\" id=\"l2\"><\/span>\n        <button class=\"rejouer\" data-play=\"s2\">Rejouer<\/button><\/div>\n    <\/div>\n    <div class=\"retenir\"><b>À retenir.<\/b>\n      <ul><li>Glisser duplique : l'original reste en place.<\/li>\n      <li>La touche Alt pendant le glissement déplace au lieu de dupliquer.<\/li>\n      <li>Déposé dans un autre secteur, le poste s'adapte : un serveur devient plongeur en cuisine.<\/li><\/ul><\/div>\n  <\/section>\n\n  <!-- 3 -->\n  <section class=\"etape\" id=\"e3\">\n    <div class=\"titre\"><span class=\"num\">3<\/span><h2>Reprendre une semaine entière<\/h2><\/div>\n    <p class=\"but\">Pour les roulements qui ne changent pas d'une semaine sur l'autre.<\/p>\n    <div class=\"scene\" data-scene=\"s3\">\n      <div class=\"ecran\" id=\"s3\">\n        <div style=\"display:flex;gap:7px;margin-bottom:9px;align-items:center\">\n          <span class=\"bt\" id=\"b3a\">Reprendre S-1<\/span>\n          <span style=\"font-size:11px;color:var(--ink2)\">ou l'icône de copie sur une ligne<\/span>\n        <\/div>\n        <div class=\"mk\"><div class=\"mkgrid\" id=\"g3\"><\/div><\/div>\n        <div class=\"toast\" id=\"t3\"><\/div>\n        <div class=\"cur\" id=\"c3\"><svg viewBox=\"0 0 20 20\"><path d=\"M2 1l6.5 16 2.3-6.4 6.4-2.3z\" fill=\"#fff\" stroke=\"#233043\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><\/svg><\/div>\n      <\/div>\n      <div class=\"barre\"><span class=\"leg\" id=\"l3\"><\/span>\n        <button class=\"rejouer\" data-play=\"s3\">Rejouer<\/button><\/div>\n    <\/div>\n    <div class=\"retenir\"><b>À retenir.<\/b>\n      <ul><li>Reprendre S-1 recopie toute la semaine précédente, absences comprises.<\/li>\n      <li>L'icône de copie sur une ligne répète le planning d'un salarié jusqu'à douze semaines d'affilée.<\/li><\/ul><\/div>\n  <\/section>\n\n  <!-- 4 -->\n  <section class=\"etape\" id=\"e4\">\n    <div class=\"titre\"><span class=\"num\">4<\/span><h2>Valider, publier, imprimer<\/h2><\/div>\n    <p class=\"but\">Valider fige la semaine et l'envoie sur les téléphones.<\/p>\n    <div class=\"scene\" data-scene=\"s4\">\n      <div class=\"ecran\" id=\"s4\">\n        <div style=\"display:flex;gap:7px;align-items:center;margin-bottom:11px\">\n          <span class=\"bt\" id=\"b4i\">Imprimer<\/span>\n          <span class=\"bt org\" id=\"b4v\">Valider la semaine<\/span>\n        <\/div>\n        <div class=\"mk\"><div class=\"mkgrid\" id=\"g4\"><\/div><\/div>\n        <div id=\"feuille4\" style=\"position:absolute;right:16px;bottom:-230px;width:190px;background:#fff;\n          border:1px solid var(--line2);box-shadow:0 7px 22px rgba(12,22,32,.22);padding:9px;\n          transition:bottom .6s cubic-bezier(.3,.8,.4,1);font-size:7px;line-height:1.35;z-index:18\">\n          <div style=\"display:flex;justify-content:space-between;border-bottom:1.6px solid #333;padding-bottom:3px;margin-bottom:4px\">\n            <b style=\"font-size:8.5px\">Les Jardins du Val d'Ornain<\/b><span>Semaine 45<\/span><\/div>\n          <div style=\"color:#555\">Planning hebdomadaire collectif<\/div>\n          <div id=\"mini4\" style=\"margin-top:4px\"><\/div>\n          <div style=\"border-top:1px solid #999;margin-top:5px;padding-top:3px;display:flex;justify-content:space-between;color:#555\">\n            <span>Édité le 05/11<\/span><span>Signature :<\/span><\/div>\n        <\/div>\n        <div class=\"toast\" id=\"t4\"><\/div>\n        <div class=\"cur\" id=\"c4\"><svg viewBox=\"0 0 20 20\"><path d=\"M2 1l6.5 16 2.3-6.4 6.4-2.3z\" fill=\"#fff\" stroke=\"#233043\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><\/svg><\/div>\n      <\/div>\n      <div class=\"barre\"><span class=\"leg\" id=\"l4\"><\/span>\n        <button class=\"rejouer\" data-play=\"s4\">Rejouer<\/button><\/div>\n    <\/div>\n    <div class=\"retenir\"><b>À retenir.<\/b>\n      <ul><li>Valider publie la semaine pour tous les salariés qui ont un code.<\/li>\n      <li>Imprimer sort les sept jours sur une feuille A4 paysage, avec un cadre pour la signature.<\/li><\/ul><\/div>\n  <\/section>\n\n  <!-- 5 -->\n  <section class=\"etape\" id=\"e5\">\n    <div class=\"titre\"><span class=\"num\">5<\/span><h2>Donner un accès à chaque salarié<\/h2><\/div>\n    <p class=\"but\">Personnel, puis Accès salariés.<\/p>\n    <div class=\"scene\" data-scene=\"s5\">\n      <div class=\"ecran\" id=\"s5\">\n        <div style=\"display:flex;justify-content:flex-end;margin-bottom:9px\">\n          <span class=\"bt org\" id=\"b5\">Générer les codes manquants<\/span><\/div>\n        <table class=\"tbl\" id=\"tb5\">\n          <thead><tr><th>Salarié<\/th><th>Code<\/th><th>Lien à envoyer<\/th><\/tr><\/thead>\n          <tbody><\/tbody><\/table>\n        <div id=\"sms5\" style=\"position:absolute;right:18px;bottom:14px;width:184px;background:#dff3e2;\n          border:1px solid #b9ddc2;border-radius:11px 11px 3px 11px;padding:8px 10px;font-size:9.5px;\n          line-height:1.4;opacity:0;transform:translateY(10px);transition:.3s;z-index:18\">\n          Bonjour Luc, voici l'accès à ton planning et à ton pointage :\n          <span style=\"color:var(--bleu);text-decoration:underline\">kik-planif.fr/#/moi/PPJ82EPV<\/span><\/div>\n        <div class=\"toast\" id=\"t5\"><\/div>\n        <div class=\"cur\" id=\"c5\"><svg viewBox=\"0 0 20 20\"><path d=\"M2 1l6.5 16 2.3-6.4 6.4-2.3z\" fill=\"#fff\" stroke=\"#233043\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><\/svg><\/div>\n      <\/div>\n      <div class=\"barre\"><span class=\"leg\" id=\"l5\"><\/span>\n        <button class=\"rejouer\" data-play=\"s5\">Rejouer<\/button><\/div>\n    <\/div>\n    <div class=\"retenir\"><b>À retenir.<\/b>\n      <ul><li>Un code de huit caractères par salarié, sans lettre ni chiffre ambigus.<\/li>\n      <li>Le lien contient déjà le code : par SMS, le salarié n'a rien à saisir.<\/li>\n      <li>Retirer coupe l'accès et efface son espace.<\/li><\/ul><\/div>\n  <\/section>\n\n  <!-- 6 -->\n  <section class=\"etape\" id=\"e6\">\n    <div class=\"titre\"><span class=\"num\">6<\/span><h2>Le salarié pointe depuis son téléphone<\/h2><\/div>\n    <p class=\"but\">Il ne voit que son planning, jamais celui des autres.<\/p>\n    <div class=\"scene\" data-scene=\"s6\">\n      <div class=\"ecran\" id=\"s6\" style=\"min-height:300px;display:flex;align-items:flex-start;justify-content:center;padding-top:14px\">\n        <div class=\"tel\" id=\"tel6\"><\/div>\n        <div class=\"cur\" id=\"c6\"><svg viewBox=\"0 0 20 20\"><path d=\"M2 1l6.5 16 2.3-6.4 6.4-2.3z\" fill=\"#fff\" stroke=\"#233043\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><\/svg><\/div>\n      <\/div>\n      <div class=\"barre\"><span class=\"leg\" id=\"l6\"><\/span>\n        <button class=\"rejouer\" data-play=\"s6\">Rejouer<\/button><\/div>\n    <\/div>\n    <div class=\"retenir\"><b>À retenir.<\/b>\n      <ul><li>Le code n'est demandé qu'une fois, le téléphone s'en souvient.<\/li>\n      <li>Je prends mon service et Je termine horodatent à la minute ; les heures restent modifiables à la main.<\/li>\n      <li>La dernière semaine consultée reste lisible sans réseau.<\/li><\/ul><\/div>\n  <\/section>\n\n  <!-- 7 -->\n  <section class=\"etape\" id=\"e7\">\n    <div class=\"titre\"><span class=\"num\">7<\/span><h2>Récupérer les heures pour la paye<\/h2><\/div>\n    <p class=\"but\">Émargement jour. collectif, puis Extraction paye.<\/p>\n    <div class=\"scene\" data-scene=\"s7\">\n      <div class=\"ecran\" id=\"s7\">\n        <div style=\"display:flex;gap:7px;margin-bottom:9px\">\n          <span class=\"bt org\" id=\"b7\">Valider les pointages déclarés<\/span><\/div>\n        <table class=\"tbl\" id=\"tb7\">\n          <thead><tr><th>Salarié<\/th><th>Prévu<\/th><th>Début réel<\/th><th>Fin réelle<\/th><th>Écart<\/th><th>État<\/th><\/tr><\/thead>\n          <tbody><\/tbody><\/table>\n        <div class=\"toast\" id=\"t7\"><\/div>\n        <div class=\"cur\" id=\"c7\"><svg viewBox=\"0 0 20 20\"><path d=\"M2 1l6.5 16 2.3-6.4 6.4-2.3z\" fill=\"#fff\" stroke=\"#233043\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><\/svg><\/div>\n      <\/div>\n      <div class=\"barre\"><span class=\"leg\" id=\"l7\"><\/span>\n        <button class=\"rejouer\" data-play=\"s7\">Rejouer<\/button><\/div>\n    <\/div>\n    <div class=\"retenir\"><b>À retenir.<\/b>\n      <ul><li>Les heures déclarées arrivent en orange, préremplies : rien n'est validé sans vous.<\/li>\n      <li>Un bouton bascule tout le jour en réel ; vous pouvez corriger une ligne avant.<\/li>\n      <li>Extraction paye sort planifié, réalisé et heures supplémentaires en CSV.<\/li><\/ul><\/div>\n  <\/section>\n\n  <!-- 8 -->\n  <section class=\"etape\" id=\"e8\">\n    <div class=\"titre\"><span class=\"num\">8<\/span><h2>Les règles de calcul<\/h2><\/div>\n    <p class=\"but\">Établissement, puis Règles de temps. À régler une fois.<\/p>\n    <div class=\"scene\" data-scene=\"s8\">\n      <div class=\"ecran\" id=\"s8\">\n        <div class=\"regl\">\n          <div class=\"b\"><span>Tolérance<\/span><b id=\"r8t\">15 minutes<\/b><\/div>\n          <div class=\"b\"><span>Arrondi<\/span><b id=\"r8a\">5 minutes<\/b><\/div>\n        <\/div>\n        <div id=\"flux8\"><\/div>\n        <div class=\"cur\" id=\"c8\"><svg viewBox=\"0 0 20 20\"><path d=\"M2 1l6.5 16 2.3-6.4 6.4-2.3z\" fill=\"#fff\" stroke=\"#233043\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><\/svg><\/div>\n      <\/div>\n      <div class=\"barre\"><span class=\"leg\" id=\"l8\"><\/span>\n        <button class=\"rejouer\" data-play=\"s8\">Rejouer<\/button><\/div>\n    <\/div>\n    <div class=\"retenir\"><b>À retenir.<\/b>\n      <ul><li>Arriver en avance ne crée pas d'heures : on repart de l'horaire prévu.<\/li>\n      <li>Un retard ou un dépassement sous la tolérance est ignoré ; au-delà, l'heure pointée est retenue puis arrondie.<\/li>\n      <li>Partir plus tôt est toujours compté, sans tolérance.<\/li><\/ul><\/div>\n  <\/section>\n\n  <!-- 9 -->\n  <section class=\"etape\" id=\"e9\">\n    <div class=\"titre\"><span class=\"num\">9<\/span><h2>Anomalies et heures supplémentaires<\/h2><\/div>\n    <p class=\"but\">Suivi des badgeages pour les alertes, Suivi des HS / HC pour les majorations.<\/p>\n    <div class=\"scene\" data-scene=\"s9\">\n      <div class=\"ecran\" id=\"s9\">\n        <table class=\"tbl\" id=\"tb9a\" style=\"margin-bottom:10px\">\n          <thead><tr><th>Salarié<\/th><th>Prévu<\/th><th>Pointé<\/th><th>Retenu<\/th><th>Anomalie<\/th><\/tr><\/thead>\n          <tbody><\/tbody><\/table>\n        <table class=\"tbl\" id=\"tb9b\">\n          <thead><tr><th>Salarié<\/th><th>Contrat<\/th><th>Retenu<\/th><th>Majorations<\/th><th>À payer en plus<\/th><\/tr><\/thead>\n          <tbody><\/tbody><\/table>\n        <div class=\"cur\" id=\"c9\"><svg viewBox=\"0 0 20 20\"><path d=\"M2 1l6.5 16 2.3-6.4 6.4-2.3z\" fill=\"#fff\" stroke=\"#233043\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><\/svg><\/div>\n      <\/div>\n      <div class=\"barre\"><span class=\"leg\" id=\"l9\"><\/span>\n        <button class=\"rejouer\" data-play=\"s9\">Rejouer<\/button><\/div>\n    <\/div>\n    <div class=\"retenir\"><b>À retenir.<\/b>\n      <ul><li>Retard, départ anticipé, dépassement et pointage manquant sont signalés ligne par ligne.<\/li>\n      <li>Le repos de onze heures entre deux journées et les six jours consécutifs déclenchent une alerte rouge.<\/li>\n      <li>Les majorations suivent les tranches réglées : 10 % jusqu'à 39 h, 20 % jusqu'à 43 h, 50 % au-delà.<\/li>\n      <li>Les heures déjà comprises dans le contrat sont distinguées de celles à payer en plus.<\/li><\/ul><\/div>\n  <\/section>\n\n  <!-- 10 -->\n  <section class=\"etape\" id=\"e10\">\n    <div class=\"titre\"><span class=\"num\">10<\/span><h2>Compteurs annuels et éléments variables<\/h2><\/div>\n    <p class=\"but\">Opérationnel pour les compteurs, Préparation paye pour les variables.<\/p>\n    <div class=\"scene\" data-scene=\"s10\">\n      <div class=\"ecran\" id=\"s10\">\n        <table class=\"tbl\" id=\"tb10a\" style=\"margin-bottom:10px\">\n          <thead><tr><th>Salarié<\/th><th>Contractuel<\/th><th>Réalisé<\/th><th>Solde<\/th><th>Contingent<\/th><\/tr><\/thead>\n          <tbody><\/tbody><\/table>\n        <table class=\"tbl\" id=\"tb10b\">\n          <thead><tr><th>Salarié<\/th><th>Jours<\/th><th>Nuit<\/th><th>Fériés<\/th><th>Repas<\/th><th>Prime<\/th><th>Acompte<\/th><\/tr><\/thead>\n          <tbody><\/tbody><\/table>\n        <div class=\"cur\" id=\"c10\"><svg viewBox=\"0 0 20 20\"><path d=\"M2 1l6.5 16 2.3-6.4 6.4-2.3z\" fill=\"#fff\" stroke=\"#233043\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><\/svg><\/div>\n      <\/div>\n      <div class=\"barre\"><span class=\"leg\" id=\"l10\"><\/span>\n        <button class=\"rejouer\" data-play=\"s10\">Rejouer<\/button><\/div>\n    <\/div>\n    <div class=\"retenir\"><b>À retenir.<\/b>\n      <ul><li>Le contingent annuel se remplit tout seul et passe au rouge en approchant des 360 heures.<\/li>\n      <li>Heures de nuit, jours fériés travaillés et repas sont comptés d'après le planning.<\/li>\n      <li>Primes et acomptes se saisissent à la main, puis repartent dans l'export de paye.<\/li><\/ul><\/div>\n  <\/section>\n\n  <!-- 11 -->\n  <section class=\"etape\" id=\"e11\">\n    <div class=\"titre\"><span class=\"num\">11<\/span><h2>Congés et demandes<\/h2><\/div>\n    <p class=\"but\">Le salarié demande depuis son téléphone, vous répondez d'un bouton.<\/p>\n    <div class=\"scene\" data-scene=\"s11\">\n      <div class=\"ecran\" id=\"s11\" style=\"min-height:316px;display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:start\">\n        <div class=\"tel\" id=\"tel11\" style=\"width:188px;margin:0\"><\/div>\n        <div>\n          <div style=\"font-size:10.5px;color:var(--ink2);font-weight:650;margin-bottom:6px\">Demandes des salariés<\/div>\n          <div id=\"dm11\"><\/div>\n          <div style=\"font-size:10.5px;color:var(--ink2);font-weight:650;margin:11px 0 6px\">Congés payés<\/div>\n          <table class=\"tbl\" id=\"cp11\">\n            <thead><tr><th>Salarié<\/th><th>Acquis<\/th><th>Pris<\/th><th>Solde<\/th><\/tr><\/thead>\n            <tbody><\/tbody><\/table>\n        <\/div>\n        <div class=\"cur\" id=\"c11\"><svg viewBox=\"0 0 20 20\"><path d=\"M2 1l6.5 16 2.3-6.4 6.4-2.3z\" fill=\"#fff\" stroke=\"#233043\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><\/svg><\/div>\n      <\/div>\n      <div class=\"barre\"><span class=\"leg\" id=\"l11\"><\/span>\n        <button class=\"rejouer\" data-play=\"s11\">Rejouer<\/button><\/div>\n    <\/div>\n    <div class=\"retenir\"><b>À retenir.<\/b>\n      <ul><li>Le salarié demande un congé ou signale une indisponibilité depuis l'onglet Mes demandes.<\/li>\n      <li>Vous voyez son solde de congés à côté de la demande, avant de répondre.<\/li>\n      <li>Accepter un congé pose les absences dans le planning ; refuser demande un motif, que le salarié lit.<\/li>\n      <li>Une indisponibilité acceptée hachure les cases concernées et vous alerte si vous y posez un service.<\/li>\n      <li>Les congés acquis se calculent à 2,5 jours ouvrables par mois travaillé, réglable dans Règles de temps.<\/li><\/ul><\/div>\n  <\/section>\n\n  <!-- dépannage -->\n  <section class=\"depan\" id=\"pb\">\n    <h2>Si quelque chose cloche<\/h2>\n    <table class=\"pb\">\n      <thead><tr><th>Ce que vous voyez<\/th><th>Que faire<\/th><\/tr><\/thead>\n      <tbody>\n        <tr><td>Le voyant en haut est orange, « Hors ligne »<\/td>\n            <td>Appuyez dessus : le diagnostic teste les adresses et indique laquelle répond.<\/td><\/tr>\n        <tr><td>« Écriture refusée par les règles Firebase »<\/td>\n            <td>Republiez le fichier de règles dans la console, onglet Realtime Database, puis Publier.<\/td><\/tr>\n        <tr><td>Le salarié voit « Code inconnu »<\/td>\n            <td>Vérifiez le code dans Accès salariés, ou recréez-en un et renvoyez le lien.<\/td><\/tr>\n        <tr><td>Son planning est vide alors qu'il travaille<\/td>\n            <td>La semaine n'est pas publiée : validez-la, ou appuyez sur Publier la semaine.<\/td><\/tr>\n        <tr><td>Dimanche est coupé à l'impression<\/td>\n            <td>Choisissez le format paysage et l'échelle à 100 %, pas « Ajuster à la page ».<\/td><\/tr>\n        <tr><td>Un créneau refuse de se poser<\/td>\n            <td>Il démarre après 16h30 : il relève du soir. Posez-le sur la colonne Soir.<\/td><\/tr>\n        <tr><td>Un salarié apparaît deux fois<\/td>\n            <td>C'est voulu : il tient un poste dans un second secteur. La ligne hachurée est son renfort.<\/td><\/tr>\n        <tr><td>Les heures retenues ne collent pas au pointage<\/td>\n            <td>La tolérance ramène les petits écarts à l'horaire prévu. Réglez-la dans Règles de temps.<\/td><\/tr>\n        <tr><td>Une alerte de repos apparaît sur une coupure<\/td>\n            <td>Elle ne compte que d'un jour sur l'autre. Si elle s'affiche, c'est que la fin de service et la reprise du lendemain sont trop proches.<\/td><\/tr>\n        <tr><td>Les compteurs annuels sont vides<\/td>\n            <td>Ils se calculent sur les semaines déjà enregistrées. Laissez la lecture se terminer avant de conclure.<\/td><\/tr>\n        <tr><td>Un salarié dit avoir envoyé une demande que vous ne voyez pas<\/td>\n            <td>Son téléphone était hors réseau : elle part toute seule à la prochaine ouverture avec du réseau.<\/td><\/tr>\n        <tr><td>Le solde de congés paraît faux la première année<\/td>\n            <td>Saisissez les jours déjà acquis ailleurs dans la colonne Report, sur l'écran Congés payés.<\/td><\/tr>\n        <tr><td>Les taux de majoration ne sont pas les vôtres<\/td>\n            <td>Ils se modifient tranche par tranche dans Règles de temps. Faites-les confirmer par votre cabinet de paye.<\/td><\/tr>\n      <\/tbody>\n    <\/table>\n    <p class=\"fin\">Une question, une envie d'ajout : demandez-le simplement.<\/p>\n  <\/section>\n<\/div>\n<script>\n\"use strict\";\nconst q=i=>document.getElementById(i);\nconst dodo=ms=>new Promise(r=>setTimeout(r,ms));\nconst SOBRE=matchMedia(\"(prefers-reduced-motion:reduce)\").matches;\n\n/* ---------- moteur ---------- */\nconst SC={};\nfunction scene(nom,fn){ SC[nom]={fn,gen:0,vu:false}; }\nasync function jouer(nom){\n  const s=SC[nom]; if(!s) return;\n  const g=++s.gen;\n  const k={\n    mort:()=>s.gen!==g,\n    pause:async ms=>{ await dodo(SOBRE?Math.min(ms,60):ms); if(s.gen!==g) throw \"stop\"; },\n    dit:t=>{ const l=q(\"l\"+nom.slice(1)); if(l) l.textContent=t; }\n  };\n  try{ await s.fn(k); if(s.gen===g && s.vu){ await k.pause(3200); jouer(nom); } }\n  catch(e){ if(e!==\"stop\") console.error(nom,e); }\n}\nfunction versEl(cur,cible,dx=0,dy=0){\n  const z=cur.parentElement.getBoundingClientRect(), r=cible.getBoundingClientRect();\n  cur.style.transform=`translate(${r.left-z.left+r.width/2+dx}px,${r.top-z.top+r.height/2+dy}px)`;\n}\nfunction versPoint(el,cible,dx=0,dy=0){\n  const z=el.parentElement.getBoundingClientRect(), r=cible.getBoundingClientRect();\n  el.style.transform=`translate(${r.left-z.left+r.width/2+dx}px,${r.top-z.top+r.height/2+dy}px)`;\n}\nasync function clic(cur,k){ cur.classList.add(\"clic\"); await k.pause(380); cur.classList.remove(\"clic\"); }\n\n/* ---------- maquette de grille ---------- */\nconst COLS=\"104px repeat(6,1fr)\";\nconst JRS=[[\"lun.\",\"02/11\"],[\"mar.\",\"03/11\"],[\"mer.\",\"04/11\"]];\nfunction grille(id,groupes){\n  let h=`<div class=\"mkhead\" style=\"grid-template-columns:${COLS}\"><span>Salarié<\/span>`;\n  for(const [j,d] of JRS) h+=`<span style=\"grid-column:span 2\">${j} ${d}<\/span>`;\n  h+=`<\/div><div class=\"mkhead\" style=\"grid-template-columns:${COLS};font-size:9px;border-bottom:1px solid var(--line2)\">\n      <span><\/span>`;\n  for(let i=0;i<3;i++) h+=`<span>Midi<\/span><span>Soir<\/span>`;\n  h+=`<\/div>`;\n  for(const g of groupes){\n    h+=`<div class=\"mkgrp\">${g.nom}<\/div>`;\n    for(const l of g.lignes){\n      h+=`<div class=\"mkrow\" style=\"grid-template-columns:${COLS}\">\n        <div class=\"mknom\"><span class=\"av\" style=\"background:${l.coul}\">${l.ini}<\/span>\n          <span style=\"min-width:0\"><b>${l.nom}<\/b><i>${l.poste}<\/i><\/span><\/div>`;\n      for(let i=0;i<6;i++) h+=`<div class=\"mkc\" id=\"${id}-${l.id}-${i}\"><\/div>`;\n      h+=`<\/div>`;\n    }\n  }\n  q(id).innerHTML=h;\n}\nfunction puce(cellId,txt,poste,coul,anim=true){\n  const c=q(cellId); if(!c) return;\n  c.innerHTML=`<div class=\"puce${anim&&!SOBRE?\" nait\":\"\"}\" style=\"background:${coul}\">\n    <b>${txt}<\/b><i>${poste}<\/i><\/div>`;\n}\nconst vide=cellId=>{ const c=q(cellId); if(c) c.innerHTML=\"\"; };\nconst LIGNES_SALLE=[{id:\"luc\",nom:\"Luc DURAND\",poste:\"Serveur\",ini:\"LD\",coul:\"#3c6e8f\"},\n                    {id:\"zoe\",nom:\"Zoé PETIT\",poste:\"Serveur\",ini:\"ZP\",coul:\"#a04a72\"}];\nconst MIDI=\"#f2a4b8\", SOIR=\"#f4b782\", MAT=\"#a9e2ce\";\n\n/* ============ 1. poser les créneaux ============ */\nscene(\"s1\",async k=>{\n  grille(\"g1\",[{nom:\"SALLE\",lignes:LIGNES_SALLE}]);\n  const cur=q(\"c1\"), fa=q(\"fa1\"), f=q(\"f1a\");\n  q(\"f1a\").classList.remove(\"actif\"); q(\"f1b\").classList.remove(\"actif\");\n  fa.classList.remove(\"on\"); fa.querySelector(\"b\").textContent=\"11:50 – 15:00\";\n  fa.querySelector(\".pt\").style.background=MIDI;\n  cur.classList.remove(\"on\");\n  await k.pause(500);\n  k.dit(\"Attrapez un créneau dans le panneau de droite.\");\n  versEl(cur,f); cur.classList.add(\"on\"); await k.pause(760);\n  versPoint(fa,f,10,-14); fa.classList.add(\"on\"); await k.pause(330);\n  const c1=q(\"g1-luc-0\");\n  k.dit(\"Lâchez-le sur la case : lundi midi pour Luc.\");\n  c1.classList.add(\"cible\"); versEl(cur,c1); versPoint(fa,c1,14,-20); await k.pause(840);\n  fa.classList.remove(\"on\"); c1.classList.remove(\"cible\");\n  puce(\"g1-luc-0\",\"11:50-15:00\",\"Serveur\",MIDI); await k.pause(760);\n  k.dit(\"Pour en poser plusieurs, cliquez le créneau une fois.\");\n  versEl(cur,f); await k.pause(640); await clic(cur,k);\n  f.classList.add(\"actif\"); await k.pause(420);\n  k.dit(\"Puis balayez les cases : elles se remplissent au passage.\");\n  for(const i of [0,2,4]){\n    const c=q(\"g1-zoe-\"+i);\n    versEl(cur,c); await k.pause(480);\n    puce(\"g1-zoe-\"+i,\"11:50-15:00\",\"Serveur\",MIDI);\n  }\n  await k.pause(620);\n  k.dit(\"Échap arrête. Le créneau du soir se pose de la même façon.\");\n  versEl(cur,q(\"f1b\")); await k.pause(620); await clic(cur,k);\n  f.classList.remove(\"actif\"); q(\"f1b\").classList.add(\"actif\");\n  for(const i of [1,3]){ const c=q(\"g1-luc-\"+i); versEl(cur,c); await k.pause(460);\n    puce(\"g1-luc-\"+i,\"18:50-23:00\",\"Serveur\",SOIR); }\n  await k.pause(700); cur.classList.remove(\"on\"); q(\"f1b\").classList.remove(\"actif\");\n});\n\n/* ============ 2. déplacer ou dupliquer ============ */\nscene(\"s2\",async k=>{\n  grille(\"g2\",[{nom:\"SALLE\",lignes:LIGNES_SALLE}]);\n  puce(\"g2-luc-0\",\"11:50-15:00\",\"Serveur\",MIDI,false);\n  const cur=q(\"c2\"), fa=q(\"fa2\");\n  fa.classList.remove(\"on\"); fa.querySelector(\"b\").textContent=\"11:50 – 15:00\";\n  fa.querySelector(\".pt\").style.background=MIDI; fa.querySelector(\"em\").textContent=\"dupliquer\";\n  cur.classList.remove(\"on\");\n  await k.pause(500);\n  k.dit(\"Attrapez un créneau déjà posé.\");\n  const src=q(\"g2-luc-0\"); versEl(cur,src); cur.classList.add(\"on\"); await k.pause(760);\n  versPoint(fa,src,14,-20); fa.classList.add(\"on\"); await k.pause(300);\n  const dst=q(\"g2-luc-4\");\n  k.dit(\"Glisser duplique : l'original reste en place.\");\n  dst.classList.add(\"cible\"); versEl(cur,dst); versPoint(fa,dst,14,-20); await k.pause(840);\n  fa.classList.remove(\"on\"); dst.classList.remove(\"cible\");\n  puce(\"g2-luc-4\",\"11:50-15:00\",\"Serveur\",MIDI); await k.pause(1100);\n  k.dit(\"Avec la touche Alt enfoncée, le créneau se déplace.\");\n  fa.querySelector(\"em\").textContent=\"déplacer\";\n  const s2=q(\"g2-luc-4\"), d2=q(\"g2-zoe-2\");\n  versEl(cur,s2); await k.pause(620);\n  versPoint(fa,s2,14,-20); fa.classList.add(\"on\"); await k.pause(300);\n  d2.classList.add(\"cible\"); versEl(cur,d2); versPoint(fa,d2,14,-20); await k.pause(840);\n  fa `<div style=\"background:#fdf2e6;border-radius:6px;padding:8px;margin-top:8px\">\n      <b style=\"font-size:10px;display:block\">Congé payé du 24/12 au 26/12<\/b>\n      <span style=\"font-size:9px;font-weight:700;color:#b06a1f\">En attente de réponse<\/span><\/div>`:\"\"}\n    ${etape>=5?`<div style=\"background:#e4f3ea;border-radius:6px;padding:8px;margin-top:8px\">\n      <b style=\"font-size:10px;display:block\">Congé payé du 24/12 au 26/12<\/b>\n      <span style=\"font-size:9px;font-weight:700;color:#1d6b41\">Acceptée<\/span><\/div>`:\"\"}\n    <\/div>`;\n  q(\"tel11\").innerHTML=base+ong+form;\n}\nscene(\"s11\",async k=>{\n  tel11(0);\n  q(\"dm11\").innerHTML=\"\"; q(\"cp11\").querySelector(\"tbody\").innerHTML=\"\";\n  const cur=q(\"c11\"); cur.classList.remove(\"on\");\n  await k.pause(500);\n  k.dit(\"Le salarié ouvre l'onglet Mes demandes.\");\n  versEl(cur,q(\"og11b\")); cur.classList.add(\"on\"); await k.pause(760); await clic(cur,k);\n  tel11(1); await k.pause(700);\n  k.dit(\"Il choisit ses dates et son motif.\");\n  versEl(cur,q(\"f11a\")); await k.pause(560); await clic(cur,k);\n  tel11(2); await k.pause(760);\n  versEl(cur,q(\"b11\")); await k.pause(560); await clic(cur,k);\n  tel11(3); await k.pause(1000);\n  k.dit(\"La demande arrive chez vous, avec son solde de congés.\");\n  const d=document.createElement(\"div\");\n  d.className=\"dmd\";\n  d.innerHTML=`<span class=\"tx\"><b>Congé payé du 24/12 au 26/12 — 3 jours<\/b><i>Luc DURAND · Serveur · « Noël en famille »<\/i><\/span>\n    <span class=\"sol\">solde 12,5 j<\/span>\n    <span class=\"bt org\" id=\"ok11\" style=\"font-size:9.5px;padding:4px 9px\">Accepter<\/span>\n    <span class=\"bt\" style=\"font-size:9.5px;padding:4px 9px\">Refuser<\/span>`;\n  q(\"dm11\").appendChild(d); await k.pause(120); d.classList.add(\"on\");\n  await k.pause(1500);\n  k.dit(\"Accepter pose les trois jours dans le planning.\");\n  versEl(cur,q(\"ok11\")); await k.pause(760); await clic(cur,k);\n  d.querySelector(\".sol\").className=\"sol bas\";\n  d.querySelector(\".sol\").textContent=\"solde 9,5 j\";\n  d.innerHTML=d.innerHTML.replace(/<span class=\"bt[\\s\\S]*$/,'<span class=\"et\" style=\"color:#1d6b41\">Acceptée<\/span>');\n  tel11(5);\n  const tb=q(\"cp11\").querySelector(\"tbody\");\n  for(const [n,a,p,so] of [[\"Luc DURAND\",\"12,5 j\",\"3 j\",\"9,5 j\"],[\"Ana MARTIN\",\"2,5 j\",\"—\",\"2,5 j\"]]){\n    const tr=document.createElement(\"tr\");\n    tr.innerHTML=`<td><b>${n}<\/b><\/td><td style=\"font-variant-numeric:tabular-nums\">${a}<\/td>\n      <td style=\"font-variant-numeric:tabular-nums\">${p}<\/td>\n      <td style=\"font-weight:700;font-variant-numeric:tabular-nums\">${so}<\/td>`;\n    tb.appendChild(tr); await k.pause(420);\n  }\n  await k.pause(1200); cur.classList.remove(\"on\");\n  k.dit(\"Le salarié voit la réponse, et son compteur de congés se met à jour.\");\n  await k.pause(1400);\n});\n\n/* ---------- lecture automatique ---------- */\ndocument.querySelectorAll(\"[data-play]\").forEach(b=>b.onclick=()=>jouer(b.dataset.play));\nconst obs=new IntersectionObserver(es=>{\n  for(const e of es){\n    const n=e.target.dataset.scene, s=SC[n]; if(!s) continue;\n    if(e.isIntersecting && !s.vu){ s.vu=true; jouer(n); }\n    else if(!e.isIntersecting && s.vu){ s.vu=false; s.gen++; }\n  }\n},{threshold:.35});\ndocument.querySelectorAll(\"[data-scene]\").forEach(e=>obs.observe(e));\n<\/script>\n<\/body>\n<\/html>\n";</script>
<script type="module">
"use strict";

/* ============================================================

   ============================================================ */
const VERSION = "v21 — 7 novembre 2026";
const LKEY = "silla-resto";
const DEF_DB = "https://towerdefense-c303b-default-rtdb.europe-west1.firebasedatabase.app";
const DB_ANCIENNES = ["https://towerdefense-c303b-default-rtdb.firebaseio.com",
                      "https://score-tp-default-rtdb.europe-west1.firebasedatabase.app"];

const DEF_NODE = "planning";
const JOURS = ["lun.","mar.","mer.","jeu.","ven.","sam.","dim."];
const JOURS_L = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const PARTS = [{id:"midi",lab:"Midi"},{id:"soir",lab:"Soir"}];

const TYPES = {
  travail:{lab:"Travail",bg:null,fg:"#16212e",code:""},
  RH:{lab:"Repos",bg:"#d8dde1",fg:"#4a5563",code:"RH"},
  CP:{lab:"Congé payé",bg:"#cdb2ea",fg:"#3b2a55",code:"CP"},
  RTT:{lab:"RTT",bg:"#e2e8ed",fg:"#44525f",code:"RTT"},
  AT:{lab:"Accident du travail",bg:"#9db1e6",fg:"#1e2a52",code:"AT"},
  MAL:{lab:"Maladie",bg:"#8f9fdd",fg:"#1b2450",code:"MAL"},
  FORM:{lab:"Formation",bg:"#a9cfc4",fg:"#1e4038",code:"FORM"}
};
const ABSENCES = ["RH","CP","RTT","MAL","AT","FORM"];
const SEUIL_SOIR = 16*60+30;
const REGLES_DEF = {
  tolerance:15,          /* minutes : en deçà, on retient l'horaire prévu */
  arrondi:5,             /* minutes : arrondi des heures retenues hors tolérance */
  seuilHS:2100,          /* 35h00, début du décompte des heures supplémentaires */
  tranches:[[2340,10],[2580,20],[6000,50]],   /* 39h à 10 %, 43h à 20 %, au-delà 50 % */
  hcPaliers:[[10,10],[33,25]],                /* complémentaires : +10 % à 10 %, puis 25 % */
  contingent:21600,      /* 360 h par an */
  reposMini:660,         /* 11 h entre deux services */
  joursMax:6,            /* jours consécutifs sans repos */
  maxJour:720,           /* 12 h sur une journée */
  maxSemaine:2880,       /* 48 h sur une semaine */
  nuitDebut:"22:00", nuitFin:"07:00",
  repasMidi:1, repasSoir:1, valeurRepas:0, indemniteNourriture:0,
  majoFerie:0,           /* majoration des heures travaillées un jour férié, en % */
  cpParMois:2.5,         /* jours ouvrables acquis par mois de travail */
  cpDebutPeriode:"06-01",/* début de la période de référence, jour et mois */
  cpSamedi:true          /* le samedi est un jour ouvrable décompté */
};
const R = () => ({...REGLES_DEF, ...(ST.cfg.regles||{})});

/* ---------- heures retenues ---------- */
function arrondiHM(t,pas){
  if(!pas||!t) return t||"";
  const m=Math.round(toMin(t)/pas)*pas;
  return pad(Math.floor(m/60)%24)+":"+pad(m%60);
}
function retenirDebut(reel,prevu,r){
  if(!reel) return prevu||"";
  if(!prevu) return arrondiHM(reel,r.arrondi);
  const a=toMin(reel), p=toMin(prevu);
  if(a<=p) return prevu;                       /* arrivé en avance : on part du prévu */
  if(a-p<=r.tolerance) return prevu;           /* petit retard toléré */
  return arrondiHM(reel,r.arrondi);
}
function retenirFin(reel,prevu,r){
  if(!reel) return prevu||"";
  if(!prevu) return arrondiHM(reel,r.arrondi);
  const f=toMin(reel), p=toMin(prevu);
  if(f>=p && f-p<=r.tolerance) return prevu;   /* dépassement léger non compté */
  return arrondiHM(reel,r.arrondi);
}
/* source des heures d'un créneau : réel validé, sinon pointage déclaré, sinon prévu */
function retenu(empId,dd,part){
  const r=R(), c=lireCreneau(empId,dd,part);
  if(!c||c.type!=="travail") return null;
  const v=lireReel(empId,dd,part)||lirePoint(empId,dd,part);
  if(!v||!v.debut||!v.fin) return {debut:c.debut,fin:c.fin,pause:c.pause||0,source:"prevu",prevu:c,brut:null};
  return {debut:retenirDebut(v.debut,c.debut,r), fin:retenirFin(v.fin,c.fin,r),
          pause:v.pause??(c.pause||0),
          source:lireReel(empId,dd,part)?"reel":"declare", prevu:c, brut:v};
}
const minutesRetenues = x => x?duree({type:"travail",debut:x.debut,fin:x.fin,pause:x.pause||0}):0;

/* ---------- anomalies ---------- */
const ANO={
  RETARD:{lab:"Retard",c:"#e8763f"}, ANTICIPE:{lab:"Départ anticipé",c:"#e8763f"},
  DEPASSE:{lab:"Dépassement",c:"#2f6f9f"}, MANQUE:{lab:"Pointage manquant",c:"#c0392b"},
  REPOS:{lab:"Repos quotidien insuffisant",c:"#c0392b"}, SERIE:{lab:"Jours consécutifs",c:"#c0392b"},
  JOUR:{lab:"Amplitude journalière",c:"#c0392b"}, SEMAINE:{lab:"Durée hebdomadaire",c:"#c0392b"}
};
function anomaliesCreneau(empId,dd,part){
  const r=R(), c=lireCreneau(empId,dd,part);
  if(!c||c.type!=="travail") return [];
  const v=lireReel(empId,dd,part)||lirePoint(empId,dd,part);
  const out=[];
  if(!v||!v.debut||!v.fin){
    if(joursEntre(dd,ymd(new Date()))>0) out.push({k:"MANQUE",d:""});
    return out;
  }
  const dr=toMin(v.debut)-toMin(c.debut);
  if(dr>r.tolerance) out.push({k:"RETARD",d:fmt(dr)});
  const df=toMin(c.fin)-toMin(v.fin);
  if(df>r.tolerance) out.push({k:"ANTICIPE",d:fmt(df)});
  if(-df>r.tolerance) out.push({k:"DEPASSE",d:fmt(-df)});
  return out;
}
/* anomalies de la semaine : repos quotidien, jours consécutifs, amplitudes */
function anomaliesSemaine(empId,js){
  const r=R(), out=[];
  const services=[];
  for(const d of js){ const dd=ymd(d);
    let jour=0;
    for(const p of PARTS){
      const x=retenu(empId,dd,p.id); if(!x) continue;
      jour+=minutesRetenues(x);
      services.push({dd,p:p.id,deb:toMin(x.debut),fin:toMin(x.fin)<=toMin(x.debut)?toMin(x.fin)+1440:toMin(x.fin),idx:js.indexOf(d)});
    }
    if(jour>r.maxJour) out.push({k:"JOUR",dd,d:fmt(jour)});
  }
  /* le repos quotidien sépare la fin du dernier service d'un jour
     du premier service du lendemain ; la coupure midi-soir n'en est pas un */
  const parJour={};
  for(const sv of services){
    const o=parJour[sv.idx]||(parJour[sv.idx]={deb:1e9,fin:-1e9,dd:sv.dd});
    o.deb=Math.min(o.deb,sv.deb); o.fin=Math.max(o.fin,sv.fin);
  }
  const idx=Object.keys(parJour).map(Number).sort((a,b)=>a-b);
  for(let i=1;i<idx.length;i++){
    const a=parJour[idx[i-1]], b=parJour[idx[i]];
    const ecart=(idx[i]*1440+b.deb)-(idx[i-1]*1440+a.fin);
    if(ecart>=0 && ecart<r.reposMini) out.push({k:"REPOS",dd:b.dd,d:fmt(ecart)});
  }
  let serie=0, maxSerie=0;
  for(const d of js){ const dd=ymd(d);
    const travaille=PARTS.some(p=>{const c=lireCreneau(empId,dd,p.id);return c&&c.type==="travail"});
    serie=travaille?serie+1:0; maxSerie=Math.max(maxSerie,serie);
  }
  if(maxSerie>r.joursMax) out.push({k:"SERIE",dd:"",d:maxSerie+" jours"});
  const tot=js.reduce((n,d)=>n+PARTS.reduce((m,p)=>m+minutesRetenues(retenu(empId,ymd(d),p.id)),0),0);
  if(tot>r.maxSemaine) out.push({k:"SEMAINE",dd:"",d:fmt(tot)});
  return out;
}

/* ---------- heures supplémentaires et complémentaires ---------- */
function tranchesHS(realise,contrat,r){
  const out=[]; let bas=r.seuilHS;
  if(realise<=bas) return out;
  for(const [haut,taux] of r.tranches){
    const hautEff=Math.min(realise,haut);
    const m=Math.max(0,hautEff-bas);
    if(m>0) out.push({de:bas,a:hautEff,taux,min:m,
      incluses:Math.max(0,Math.min(contrat,hautEff)-bas)});
    bas=haut;
    if(realise<=haut) break;
  }
  return out;
}
function tranchesHC(realise,contrat,r){
  if(realise<=contrat) return [];
  const out=[]; let bas=contrat;
  for(const [pct,taux] of r.hcPaliers){
    const haut=Math.round(contrat*(1+pct/100));
    const m=Math.max(0,Math.min(realise,haut)-bas);
    if(m>0) out.push({de:bas,a:Math.min(realise,haut),taux,min:m});
    bas=haut;
    if(realise<=haut) return out;
  }
  if(realise>bas) out.push({de:bas,a:realise,taux:r.hcPaliers[r.hcPaliers.length-1][1],min:realise-bas,hors:true});
  return out;
}

/* ---------- heures de nuit ---------- */
function minutesNuit(deb,fin,r){
  const n1=toMin(r.nuitDebut), n2=toMin(r.nuitFin);
  let a=toMin(deb), b=toMin(fin); if(b<=a) b+=1440;
  let t=0;
  for(const [x,y] of [[n1,1440],[0,n2],[n1+1440,2880],[1440,n2+1440]])
    t+=Math.max(0,Math.min(b,y)-Math.max(a,x));
  return t;
}

/* ---------- congés payés ---------- */
function periodeCP(ref){
  const r=R(), [mo,jo]=r.cpDebutPeriode.split("-").map(Number);
  const d=ref||new Date();
  let an=d.getFullYear();
  if((d.getMonth()+1)*100+d.getDate() < mo*100+jo) an--;
  const deb=new Date(an,mo-1,jo), fin=new Date(an+1,mo-1,jo);
  fin.setDate(fin.getDate()-1);
  return {deb,fin,an};
}
const ouvrable = dd => dateDe(dd).getDay()!==0 && !ferie(dd) &&
  (R().cpSamedi || dateDe(dd).getDay()!==6);
/* jours de congé décomptés dans une plage : un jour compte dès qu'un service est en CP */
function cpPris(empId,deb,fin,type){
  let n=0;
  for(let d=new Date(deb); d<=fin; d.setDate(d.getDate()+1)){
    const dd=ymd(d), sid=semId(d);
    const pose=PARTS.some(p=>{const c=creneauSid(sid,empId,dd,p.id);return c&&c.type===(type||"CP")});
    if(pose && (type&&type!=="CP" ? true : ouvrable(dd))) n++;
  }
  return n;
}
function bilanCP(e,ref){
  const r=R(), per=periodeCP(ref), auj=ref||new Date();
  const emb=e.embauche?dateDe(e.embauche):null;
  const depart=emb&&emb>per.deb?emb:per.deb;
  const fin=auj<per.fin?auj:per.fin;
  let mois=0;
  if(fin>=depart){
    /* mois entiers révolus : un mois commencé n'ouvre pas de droit */
    mois=(fin.getFullYear()-depart.getFullYear())*12+(fin.getMonth()-depart.getMonth());
    if(fin.getDate()<depart.getDate()) mois--;
    mois=Math.max(0,mois);
  }
  const acquis=Math.round(mois*r.cpParMois*10)/10;
  const report=+(e.cpInitial||0);
  const pris=cpPris(e.id,per.deb,auj);
  const aVenir=cpPris(e.id,new Date(auj.getTime()+86400000),per.fin);
  return {per,mois,acquis,report,pris,aVenir,solde:Math.round((report+acquis-pris-aVenir)*10)/10};
}

/* ---------- jours fériés ---------- */
function paques(an){
  const a=an%19, b=Math.floor(an/100), c=an%100;
  const d=Math.floor(b/4), e=b%4, f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3);
  const h=(19*a+b-d-g+15)%30, i=Math.floor(c/4), k=c%4;
  const l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451);
  const mo=Math.floor((h+l-7*m+114)/31), jo=((h+l-7*m+114)%31)+1;
  return new Date(an,mo-1,jo);
}
function feriesFr(an){
  const P=paques(an), dec=(n)=>{const d=new Date(P);d.setDate(d.getDate()+n);return d};
  const L=[[new Date(an,0,1),"Jour de l'an"],[dec(1),"Lundi de Pâques"],[new Date(an,4,1),"Fête du travail"],
    [new Date(an,4,8),"Victoire 1945"],[dec(39),"Ascension"],[dec(50),"Lundi de Pentecôte"],
    [new Date(an,6,14),"Fête nationale"],[new Date(an,7,15),"Assomption"],[new Date(an,10,1),"Toussaint"],
    [new Date(an,10,11),"Armistice"],[new Date(an,11,25),"Noël"]];
  const o={}; for(const [d,n] of L) o[ymd(d)]=n;
  return o;
}
const cacheFeries={};
function ferie(dd){
  const an=+dd.slice(0,4);
  if(!cacheFeries[an]) cacheFeries[an]=feriesFr(an);

}

function verifierLargeur(){
  if(estMobile()||reajuste) return;
  const g=document.querySelector(".gridwrap"), t=g&&g.querySelector("table.pl");
  if(!g||!t) return;
  const R=document.documentElement.style;
  let col=parseInt(R.getPropertyValue("--colw"))||90, garde=0;
  while(t.scrollWidth>g.clientWidth+1 && col>46 && garde++<20){
    col-=3; R.setProperty("--colw",col+"px");
  }
  document.body.classList.toggle("dense",col<86);
  if(!gelerSerre && colSerre!==(col<86)){ colSerre=col<86; reajuste=true; rendre().then(()=>reajuste=false); }
}

let FB=null, unsubSem=null, unsubReel=null;
let enLigne=false, cacheIncomplet=false, diagFait=false;
const REGIONS=["firebaseio.com","europe-west1.firebasedatabase.app","us-central1.firebasedatabase.app",
               "asia-southeast1.firebasedatabase.app"];
function candidats(){
  const m=String(dbUrl).match(/^https:\/\/([^.]+)\./);
  const noms=m?[m[1]]:[];
  const urls=[dbUrl,...noms.flatMap(n=>REGIONS.map(r=>"https://"+n+"."+r))];
  return [...new Set(urls.filter(Boolean))];
}
async function sonder(url){
  try{
    const c=new AbortController(); const t=setTimeout(()=>c.abort(),6000);
    const r=await fetch(url+"/"+dbNode+".json?shallow=true",{signal:c.signal});
    clearTimeout(t);
    if(r.ok) return {url,ok:true,txt:"accessible"};
    if(r.status===401||r.status===403) return {url,ok:false,txt:"adresse correcte, règles à publier"};
    return {url,ok:false,txt:"erreur "+r.status};
  }catch(e){ return {url,ok:false,txt:"injoignable"}; }
}
const sonderTout = () => Promise.all(candidats().map(sonder));
async function diagnosticAuto(){
  if(diagFait) return; diagFait=true;
  const r=await sonderTout();
  const bon=r.find(x=>x.ok&&x.url!==dbUrl);
  const regles=r.find(x=>x.url===dbUrl&&x.txt.includes("règles"));
  if(bon) toast("Une autre adresse répond : ouvrez l'indicateur de synchronisation");
  else if(regles) toast("Adresse correcte mais règles Firebase non publiées pour « "+dbNode+" »");
}
const majSync=(cls,txt)=>{$("#syncDot").className="dot "+cls;$("#syncTxt").textContent=txt};
let derniereErreur=null;
function erreurEcriture(e){
  const m=(e&&e.message)?String(e.message):"";
  const perm=/permission|denied/i.test(m);
  derniereErreur={ts:Date.now(), msg:m||"refus sans message", chemin:cheminEnCours};
  toast(perm ? "Écriture refusée par les règles Firebase. Ouvrez l'indicateur de synchronisation."
             : "Écriture impossible"+(m?" : "+m.slice(0,90):""));
}
let cheminEnCours="";
function ecrire(chemin,val){
  cheminEnCours=chemin;
  const r=FB.ref(FB.db,chemin);
  return (val===null?FB.remove(r):FB.set(r,val)).catch(erreurEcriture);
}

async function initFirebase(){
  if(!dbUrl){ majSync("","Local"); return; }
  majSync("off","Connexion");
  try{
    const [A,D]=await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js")]);
    FB={db:D.getDatabase(A.initializeApp({databaseURL:dbUrl},"si"+Date.now())), ...D};
    FB.onValue(FB.ref(FB.db,".info/connected"),s=>{
      const ok=!!s.val();
      if(ok&&!enLigne){ ST.cache={}; cacheIncomplet=false; rendre(); }
      enLigne=ok; majSync(ok?"on":"off", ok?"Synchronisé":"Hors ligne");
      if(!ok) setTimeout(()=>{ if(!enLigne) diagnosticAuto(); },8000);
    });
    FB.onValue(FB.ref(FB.db,dbNode+"/config"),s=>{
      const v=s.val();
      if(v) ST.cfg={ resto:{...ST.cfg.resto,...(v.resto||{})}, services:v.services||ST.cfg.services,
                     postes:v.postes||ST.cfg.postes,
                     posteService:v.posteService||ST.cfg.posteService||{}, favoris:v.favoris||{} };
      mirroir(); majEntete(); rendre();
    },()=>{ majSync("off","Accès refusé"); toast("Firebase refuse la lecture du nœud « "+dbNode+" »"); });
    FB.onValue(FB.ref(FB.db,dbNode+"/employes"),s=>{ ST.employes=s.val()||{}; mirroir(); abonnerPointages(); rendre(); });
    FB.onValue(FB.ref(FB.db,dbNode+"/validations"),s=>{ ST.validations=s.val()||{}; rendre(); });
    FB.onValue(FB.ref(FB.db,dbNode+"/indispo"),s=>{ ST.indispo=s.val()||{}; if(vue==="planning")rendre(); });
    FB.onValue(FB.ref(FB.db,dbNode+"/evp"),s=>{ ST.evp=s.val()||{}; if(["evp","paye"].includes(vue))rendre(); });
    FB.onValue(FB.ref(FB.db,dbNode+"/traces"),s=>{ ST.traces=s.val()||{}; if(vue==="traces")rendre(); });
    abonnerSemaine();
  }catch(e){ FB=null; majSync("","Local"); toast("Firebase injoignable, données locales uniquement"); }
}

    ST.reel=s.val()||{}; if(vue==="em-jour"||vue==="em-hebdo")rendre(); });

function publierSalarie(id,sid){

  const base=nodePerso()+"/"+e.code;
  FB.set(FB.ref(FB.db,base+"/info"),{prenom:e.prenom||"",nom:e.nom||"",poste:e.poste||"",
    service:e.service||"",contrat:e.contrat||0,etab:(ST.cfg.resto||{}).nom||"",maj:Date.now()}).catch(()=>{});
  const src=((sid===semId(lundi)?ST.sem:(ST.cache[sid]||{}))[id])||{};
  const net={};
  for(const d of Object.keys(src)) if(src[d]&&Object.keys(src[d]).length) net[d]=src[d];
  FB.set(FB.ref(FB.db,base+"/sem/"+sid), Object.keys(net).length?net:null).catch(()=>{});
}
const enAttente=new Map(); let tPublie;

  if(!FB||!ST.employes[id]||!ST.employes[id].code) return;
  enAttente.set(id+"|"+sid,[id,sid]);
  clearTimeout(tPublie);
  tPublie=setTimeout(()=>{ for(const [i,x] of enAttente.values()) publierSalarie(i,x); enAttente.clear(); },1000);

function publierTout(sid){

function retenuSid(sid,e,d,p){
  const r=R(), c=creneauSid(sid,e,d,p);
  if(!c||c.type!=="travail") return null;
  const v=reelSid(sid,e,d,p);
  if(!v||!v.debut||!v.fin) return {debut:c.debut,fin:c.fin,pause:c.pause||0};
  return {debut:retenirDebut(v.debut,c.debut,r),fin:retenirFin(v.fin,c.fin,r),pause:v.pause??(c.pause||0)};
}
function bilanSemaineId(empId,sid){
  const r=R(), j=semaineSid(sid)[empId]||{};
  let min=0,nuit=0,minFerie=0,repas=0,jours=0; const abs={};
  for(const d of Object.keys(j)){
    let jourMin=0;
    for(const pt of PARTS){
      const c=j[d][pt.id]; if(!c) continue;
      if(c.type!=="travail"){ abs[c.type]=(abs[c.type]||0)+0.5; continue; }
      const x=retenuSid(sid,empId,d,pt.id), m=minutesRetenues(x);
      min+=m; jourMin+=m;
      nuit+=minutesNuit(x.debut,x.fin,r);
      if(ferie(d)) minFerie+=m;
      repas += pt.id==="midi"?r.repasMidi:r.repasSoir;
    }
    if(jourMin>0) jours++;
  }
  return {min,nuit,ferie:minFerie,repas,jours,abs};
}
